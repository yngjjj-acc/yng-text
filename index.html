  const foClick = async e => {
    const fe = e.target.closest('[data-fe]'), fo = e.target.closest('[data-fo]');
    if(e.target.closest('#flFNew')){ await openFolderForm(); return; }
    if(fe){ e.stopPropagation(); const f = M.folders.find(x => x.id === fe.dataset.fe); if(f) openFolderForm(f); return; }
    if(fo && fo.dataset.fo) openFolderModal(fo.dataset.fo);
  };
  $('#flFolders').addEventListener('click', foClick); $('#flCrumb').addEventListener('click', foClick);
  $('#flFolders').addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-fo]')){ e.preventDefault(); foClick(e); } });
  const list = $('#flList');
  list.addEventListener('toggle', e => {
    const d = e.target;
    if(d.matches && d.matches('.np-card') && d.open && !d.dataset.f && DR[d.dataset.id]){ d.dataset.f = '1'; d.querySelector('.cb').innerHTML = cbody(DR[d.dataset.id]); }
  }, true);
  list.addEventListener('click', async e => {
    const pn = e.target.closest('[data-pin]'), dl = e.target.closest('[data-dl]'), du = e.target.closest('[data-dup]'), mo = e.target.closest('[data-more]'), de = e.target.closest('[data-del]'), mv = e.target.closest('[data-mv]'), pr = e.target.closest('[data-props]');
    if(pn){ e.preventDefault(); e.stopPropagation(); const r = DR[pn.dataset.pin]; if(r) togglePin(r); return; }
    if(mv){ const r = DR[mv.dataset.mv]; if(r) pickFolder(r); return; }
    if(pr){ const r = DR[pr.dataset.props]; if(r) openProps(r); return; }
    if(dl){ const id = dl.dataset.dl; openPop(dl, `<div class="mh">Скачать файл</div><button class="mi" data-a="md">${ico('dl')}Markdown<span class="k">.md</span></button><button class="mi" data-a="txt">${ico('dl')}Обычный текст<span class="k">.txt</span></button><button class="mi" data-a="html">${ico('dl')}Веб-страница<span class="k">.html</span></button><button class="mi" data-a="json">${ico('dl')}Резервная копия<span class="k">.json</span></button>`, p => p.addEventListener('click', ev => { const m = ev.target.closest('[data-a]'); if(m && DR[id]){ closePop(); exportOne(DR[id], m.dataset.a); } })); return; }
    if(du){ const r = DR[du.dataset.dup]; if(r) duplicate(r); return; }
    if(mo){ const nb = mo.closest('.cb').querySelector('.nb'); const on = nb.classList.toggle('exp'); mo.textContent = on ? 'Свернуть' : 'Развернуть'; return; }
    if(de){ const r = DR[de.dataset.del]; if(r) deleteDraft(r); return; }
  });
  list.addEventListener('dragstart', e => {
    const s = e.target.closest('[data-drag]'); if(!s) return;
    e.dataTransfer.setData('text/yng-file', s.dataset.drag); e.dataTransfer.effectAllowed = 'move';
  });
  drawList();
}
/* drag files onto folders / trash */
const hasYng = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('text/yng-file');
document.addEventListener('dragover', e => {
  if(!hasYng(e)) return;
  const t = e.target.closest && e.target.closest('.ftile[data-fo],.ftile[data-root],.trash-fab');
  document.querySelectorAll('.ftile.over,.trash-fab.over').forEach(x => x !== t && x.classList.remove('over'));
  if(t){ e.preventDefault(); t.classList.add('over'); }
});
document.addEventListener('drop', e => {
  if(!hasYng(e)) return;
  const t = e.target.closest && e.target.closest('.ftile[data-fo],.ftile[data-root],.trash-fab'); if(!t) return;
  e.preventDefault(); t.classList.remove('over');
  const r = DR[e.dataTransfer.getData('text/yng-file')]; if(!r) return;
  if(t.classList.contains('trash-fab')) trashDraft(r, false); else moveToFolder(r, t.dataset.fo || null);
});

/* drag & drop of files */
const dropEl = $('#drop'); let dragN = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if(view === 'files' && hasFiles(e)){ dragN++; dropEl.classList.add('on'); } });
window.addEventListener('dragleave', e => { if(view === 'files' && hasFiles(e)){ dragN = Math.max(0, dragN - 1); if(!dragN) dropEl.classList.remove('on'); } });
window.addEventListener('dragover', e => { if(hasFiles(e) && (view === 'files' || !ed.contains(e.target))) e.preventDefault(); });
window.addEventListener('drop', e => {
  if(!hasFiles(e) || view === 'board' || (view === 'ed' && ed.contains(e.target))) return;
  e.preventDefault(); dragN = 0; dropEl.classList.remove('on');
  const fs = Array.from(e.dataTransfer.files).filter(f => !/^image\//.test(f.type));
  if(fs.length) importFiles(fs);
});

/* ================= trash-aware delete ================= */
async function trashDraft(rec, ask){
  if(ask){
    const v = await modal({title: 'Удалить черновик?', text: `«${rec.title || 'Без названия'}» попадёт в корзину — оттуда его можно восстановить (хранятся 10 последних удалённых файлов).`, buttons: [{t:'Отмена', v:'no', cls:'neutral'}, {t:'Удалить', v:'yes', cls:'danger'}]});
    if(v !== 'yes') return;
  }
  const wasCur = cur && cur.id === rec.id;
  if(wasCur){ clearTimeout(timer); dirty = false; }
  const snap = fixRec(rec);
  delete DR[rec.id];
  try{ await dbDel(rec.id); }catch(e){}
  await toTrash(snap);
  badge();
  if(wasCur){ cur = null; nav('#/edit'); }
  else refreshView();
  toast('Файл перемещён в корзину', 'Вернуть', async () => {
    const i = M.trash.findIndex(x => x.rec.id === snap.id);
    if(i >= 0){ const r = await restoreTrash(i); if(r && view !== 'files') nav('#/d/' + r.id); }
  });
}
const deleteDraft = rec => trashDraft(rec, true);

/* ================= router ================= */
let prevView = null;
function setView(v){
  view = v;
  const map = {home: vHome, ed: vEd, files: vFiles, tasks: vTasks, cal: vCal, board: vBoard, slides: vSlides, deck: vDeck};
  Object.keys(map).forEach(k => { map[k].hidden = k !== v; });
  const ln = {home: 'lnkHome', ed: 'lnkEd', files: 'lnkFiles', tasks: 'lnkTasks', cal: 'lnkCal', board: 'lnkBoard', slides: 'lnkSlides', deck: 'lnkSlides'};
  Object.keys(ln).forEach(k => { const a = $('#' + ln[k]); a.classList.toggle('act', k === v || (v === 'deck' && k === 'slides') || (v === 'slides' && k === 'deck')); a.setAttribute('aria-current', (k === v || (v === 'deck' && k === 'slides')) ? 'page' : 'false'); });
  if(v !== 'ed'){ document.body.classList.remove('zen'); $('#btnZen').classList.remove('on'); }
  document.body.classList.toggle('board-mode', v === 'board');
  document.body.classList.toggle('deck-mode', v === 'deck');
  updTrash(); applyWp();
}
const TTL = {home: 'Главная', files: 'Все файлы', tasks: 'Задачи', cal: 'Календарь', board: 'Холст', slides: 'Презентации', deck: 'Презентация'};
function setDocTitle(){ document.title = TTL[view] ? TTL[view] + ' — yng text' : ((cur && cur.title) || 'Без названия') + ' — yng text'; }
async function route(){
  closePop(); bubble.classList.remove('on');
  let seg = location.hash.replace(/^#\/?/, '').split('/');
  await flush();
  if(seg[0] === 'd' && DR[seg[1]] && isDeck(DR[seg[1]])){ seg = ['deck', seg[1]]; try{ history.replaceState(null, '', '#/deck/' + seg[1]); }catch(e){} }
  const name = ({files: 'files', tasks: 'tasks', cal: 'cal', board: 'board', slides: 'slides', deck: 'deck', d: 'ed', edit: 'ed'})[seg[0]] || 'home';
  const changedView = prevView !== name;
  if(prevView === 'board' && name !== 'board') bdLeave();
  if(prevView === 'deck' && name !== 'deck') dkLeave();
  prevView = name;
  if(name !== 'ed'){
    setView(name);
    ({home: renderHome, files: renderFiles, tasks: renderTasks, cal: renderCal, board: bdEnter, slides: renderSlides, deck: () => dkEnter(seg[1])})[name]();
    setDocTitle(); badge(); taskBadge();
    if(changedView) window.scrollTo(0, 0);
    return;
  }
  setView('ed');
  const id = seg[0] === 'd' ? seg[1] : null;
  let rec = id ? (DR[id] || (cur && cur.id === id ? cur : null)) : cur;
  if(!rec){
    if(id) toast('Такого черновика не нашлось — открыт последний');
    rec = DR[store.get('yng-cur', '')] || newest() || blank();
  }
  if(!cur || cur.id !== rec.id) load(rec);
  if(id && rec.id !== id){ try{ history.replaceState(null, '', '#/d/' + rec.id); }catch(e){} }
  counter(); updDate(); setDocTitle(); badge(); updProps(); refreshInline(); taskBadge(); applyPage();
  if(changedView) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { if(started) route(); });

/* ================= global events ================= */
function curTheme(){
  const a = document.documentElement.getAttribute('data-theme');
  if(a) return a;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
$('#themeBtn').addEventListener('click', () => {
  const n = curTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  try{ localStorage.setItem('yng-theme', n); }catch(e){}
});
$('#tagBtn').addEventListener('click', e => popTags(e.currentTarget));
$('#searchBtn').addEventListener('click', openSearch);
$('#trashFab').addEventListener('click', openTrash);
$('#tkTrashFab').addEventListener('click', openTaskTrash);
$('#edProps').addEventListener('click', () => openProps(cur));
document.addEventListener('click', ev => {
  const im = ev.target.closest('#vFiles img[data-zoom]');
  if(im){ const z = $('#zoom'); $('img', z).src = im.src; z.classList.add('on'); return; }
  if(ev.target.closest('#zoom')){ $('#zoom').classList.remove('on'); return; }
  let el;
  if((el = ev.target.closest('[data-clrtag]'))) return setTag('');
  if((el = ev.target.closest('[data-tck]'))){ const t = M.tasks.find(x => x.id === el.dataset.tck); if(t) toggleDone(t); return; }
  if((el = ev.target.closest('[data-topen]'))){ const t = M.tasks.find(x => x.id === el.dataset.topen); if(t) openTaskForm({task: t}); return; }
  if((el = ev.target.closest('[data-fopen]'))) nav('#/d/' + el.dataset.fopen);
});
document.addEventListener('keydown', ev => {
  const mod = ev.ctrlKey || ev.metaKey;
  if(ev.key === 'Escape'){
    if(pop){ closePop(); return; }
    if($('#zoom').classList.contains('on')){ $('#zoom').classList.remove('on'); return; }
    if(document.body.classList.contains('zen')) setZen(false);
    return;
  }
  if(mod && !ev.altKey && ev.key.toLowerCase() === 's'){ ev.preventDefault(); if(view === 'ed') flush().then(() => toast('Сохранено')); return; }
  if(mod && ev.key === '/'){ ev.preventDefault(); openSearch(); return; }
  if(ev.altKey && !mod && ev.code === 'KeyN'){ ev.preventDefault(); newDraft(); }
});
setInterval(() => { tickHome(); }, 1000);
setInterval(() => {
  checkReminders(); taskBadge();
  const a = document.activeElement;
  if(['home', 'tasks', 'cal'].includes(view) && !document.querySelector('.np-modal') && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) refreshView();
}, 30000);

applyView();
const go = () => { if(started) return; started = true; route(); };
initStore().catch(() => {}).then(() => loadMeta().catch(() => {}).then(() => wpLoad()).then(() => bdLoad()).then(() => { bdBuild(); bdWire(); })).then(() => {
  badge(); taskBadge(); updTrash();
  setTag(M.tag);
  if(started){ if(cur && cur.transient && !dirty) cur = null; route(); } else go();
  checkReminders();
  let ls = true; try{ localStorage.setItem('yng-t', '1'); localStorage.removeItem('yng-t'); }catch(e){ ls = false; }
  if(!db && !ls) setTimeout(() => toast('Память браузера недоступна: файлы не сохранятся после закрытия вкладки. Скачивайте их вручную.'), 600);
});
setTimeout(go, 2500);

})();

</script>
