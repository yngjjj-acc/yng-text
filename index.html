/* ---------- meta store (tasks, folders, trash) — отдельная БД, чтобы не трогать черновики ---------- */
const M = {tasks: [], folders: [], trash: [], tag: store.get('yng-tag', '')};
let mdb = null, pendingFolder = null, extraN = 0;
function openMeta(){
  return new Promise(res => {
    try{
      if(!window.indexedDB) return res(null);
      const r = indexedDB.open('yng-text-meta', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('meta', {keyPath:'k'}); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    }catch(e){ res(null); }
  });
}
const mtx = (mode, fn) => new Promise((res, rej) => {
  const t = mdb.transaction('meta', mode); const o = fn(t.objectStore('meta'));
  t.oncomplete = () => res(o && o.result); t.onerror = t.onabort = () => rej(t.error);
});
const PRK = ['crit','high','mid','low'], STK = ['plan','prog','done','hold'];
const PR = {crit:{t:'Критический', c:'#ff3b30'}, high:{t:'Высокий', c:'#ff9f0a'}, mid:{t:'Средний', c:'#0a84ff'}, low:{t:'Низкий', c:'#8e8e93'}};
const ST_F = {plan:'План', prog:'В процессе', done:'Завершено', hold:'Отложено'};
const ST_K = {plan:'В планах', prog:'В работе', done:'Готово', hold:'Отложено'};
function normTags(a){
  if(typeof a === 'string') a = a.split(/[\s,;]+/);
  const out = [];
  (Array.isArray(a) ? a : []).forEach(x => { x = String(x).replace(/^#+/, '').toLowerCase().replace(/[^\p{L}\p{N}_-]/gu, '').slice(0, 30); if(x && !out.includes(x)) out.push(x); });
  return out.slice(0, 12);
}
const okId = s => typeof s === 'string' && /^[\w-]{3,40}$/.test(s);
function fixTask(r){
  if(!r || typeof r.title !== 'string' || !r.title.trim()) return null;
  return {
    id: okId(r.id) ? r.id : uid(), title: r.title.trim().slice(0, 200), desc: typeof r.desc === 'string' ? r.desc.slice(0, 5000) : '',
    subs: Array.isArray(r.subs) ? r.subs.filter(s => s && typeof s.t === 'string').map(s => ({t: s.t.slice(0, 200), d: !!s.d})).slice(0, 50) : [],
    start: /^\d{4}-\d\d-\d\d$/.test(r.start || '') ? r.start : '', due: +r.due > 0 ? +r.due : null, tm: !!r.tm,
    prio: PRK.includes(r.prio) ? r.prio : 'mid', tags: normTags(r.tags || []), status: STK.includes(r.status) ? r.status : 'plan',
    notify: Array.isArray(r.notify) ? r.notify.map(Number).filter(n => [12, 6, 2].includes(n)) : [],
    files: Array.isArray(r.files) ? r.files.filter(okId).slice(0, 30) : [], created: +r.created || Date.now(), del: +r.del > 0 ? +r.del : null,
    emoji: (typeof r.emoji === 'string' && EMSET.has(emKey(r.emoji))) ? r.emoji : '',
    att: Array.isArray(r.att) ? r.att.filter(a => a && okId(a.id) && typeof a.name === 'string').map(a => ({id: a.id, name: a.name.slice(0, 200), size: Math.max(0, +a.size || 0), type: String(a.type || '').slice(0, 100)})).slice(0, 20) : [],
    fired: (r.fired && typeof r.fired === 'object') ? r.fired : {}
  };
}
function fixFolder(r){
  if(!r || typeof r.name !== 'string') return null;
  return {id: okId(r.id) ? r.id : uid(), name: r.name.trim().slice(0, 40) || 'Папка', color: /^#[0-9a-f]{6}$/i.test(r.color || '') ? r.color : FCOL[0], icon: FIC[r.icon] ? r.icon : 'notes', created: +r.created || Date.now()};
}
async function loadMeta(){
  mdb = await openMeta();
  for(const k of ['tasks', 'folders', 'trash']){
    let v = null;
    try{
      if(mdb){ const row = await mtx('readonly', s => s.get(k)); v = row && row.v; }
      else v = JSON.parse(localStorage.getItem('yng-m-' + k) || 'null');
    }catch(e){}
    M[k] = Array.isArray(v) ? v : [];
  }
  M.tasks = M.tasks.map(fixTask).filter(Boolean);
  M.folders = M.folders.map(fixFolder).filter(Boolean);
  M.trash = M.trash.filter(x => x && x.rec && typeof x.rec.html === 'string' && okId(x.rec.id)).map(x => ({at: +x.at || Date.now(), rec: fixRec(x.rec)})).slice(0, 10);
}
async function metaSave(k){
  try{ if(mdb) await mtx('readwrite', s => s.put({k, v: M[k]})); else localStorage.setItem('yng-m-' + k, JSON.stringify(M[k])); }
  catch(e){ toast('Не удалось сохранить: память браузера недоступна или заполнена. Скачайте резервную копию.'); }
}
function mergeExtra(o){
  let nt = 0, nf = 0;
  if(Array.isArray(o.folders)) o.folders.map(fixFolder).filter(Boolean).forEach(f => { if(!M.folders.some(x => x.id === f.id)){ M.folders.push(f); nf++; } });
  if(Array.isArray(o.tasks)) o.tasks.map(fixTask).filter(Boolean).forEach(t => { const i = M.tasks.findIndex(x => x.id === t.id); if(i < 0){ M.tasks.push(t); nt++; } else { M.tasks[i] = t; } });
  if(o.board){ const nb = bdMerge(o.board); if(nb){ extraN += nb; toast('Загружено объектов холста: ' + nb); } }
  if(nt || nf){ extraN += nt + nf; metaSave('tasks'); metaSave('folders'); toast('Загружено задач: ' + nt + ', папок: ' + nf); }
}

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const dkey = d => { d = d instanceof Date ? d : new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fromKey = k => { const a = String(k).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDS = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const fmtDay = k => { const d = fromKey(k); return d.getDate() + ' ' + MONG[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dueStr = t => t.due ? fmtDay(dkey(t.due)) + (t.tm ? ', ' + hm(t.due) : '') : '';
function relTime(ms){
  ms = Math.abs(ms); const m = Math.round(ms / 60000);
  if(m < 60) return Math.max(1, m) + ' мин';
  const h = Math.round(m / 60); if(h < 48) return h + ' ч';
  const d = Math.round(h / 24); return d + ' ' + plural(d, 'день', 'дня', 'дней');
}

/* ---------- task helpers ---------- */
const isDone = t => t.status === 'done';
const isOver = t => !!t.due && !isDone(t) && t.due < Date.now();
const isHot = t => !!t.due && !isDone(t) && t.due >= Date.now() && t.due - Date.now() < 12 * 3600e3;
const taskCls = t => isOver(t) ? 'over' : isHot(t) ? 'hot' : '';
const tDay = t => t.due ? dkey(t.due) : (t.start || '');
function tNote(t){ // подпись под названием
  const p = [];
  if(t.due) p.push(dueStr(t)); else if(t.start) p.push('с ' + fmtDay(t.start));
  if(isOver(t)) p.push('просрочено'); else if(isHot(t)) p.push('горит');
  if(t.subs.length) p.push('✓ ' + t.subs.filter(s => s.d).length + '/' + t.subs.length);
  const nf = t.files.filter(id => DR[id]).length; if(nf) p.push('📄 ' + nf);
  return p.join(' · ');
}
const tagsHtml = a => (a || []).map(x => `<span class="tg-c">#${esc(x)}</span>`).join('');
function fileTags(r){
  const s = new Set(r.tags || []);

  return s;
}
const visTasks = () => M.tasks.filter(t => !t.del && (!M.tag || t.tags.includes(M.tag)));
const visFiles = () => { const a = Object.values(DR); return M.tag ? a.filter(r => fileTags(r).has(M.tag)) : a; };
function allTags(){
  const c = {};
  M.tasks.forEach(t => { if(!t.del) t.tags.forEach(x => { c[x] = (c[x] || 0) + 1; }); });
  Object.values(DR).forEach(r => (r.tags || []).forEach(x => { c[x] = (c[x] || 0) + 1; }));
  return c;
}
const folderOf = r => (r.folder && M.folders.find(f => f.id === r.folder)) || null;
const tagBar = () => M.tag ? `<div class="tagbar"><span>Фильтр по тегу <b>#${esc(M.tag)}</b> — показаны только связанные файлы, задачи и дедлайны.</span><button type="button" class="btn small ghost" data-clrtag>Сбросить</button></div>` : '';
function taskBadge(){
  const k = dkey(new Date()), n = M.tasks.filter(t => !t.del && !isDone(t) && ((t.due && (dkey(t.due) === k || t.due < Date.now())) || t.start === k)).length;

}

function refreshInlineOld(root){
  (root || ed).querySelectorAll('p[data-tk]').forEach(p => {

function createQuick(text, preset){

/* ---------- notifications ---------- */
function checkReminders(){
  const now = Date.now(); let ch = false;
  M.tasks.forEach(t => {
    if(t.del || isDone(t) || !t.due || !t.notify.length) return;
    t.notify.forEach(h => {
      if(t.fired[h]) return;
      if(now >= t.due - h * 3600e3){
        t.fired[h] = 1; ch = true;
        if(now > t.due) return;
        const body = 'Дедлайн через ' + relTime(t.due - now) + ': ' + t.title;
        try{ if('Notification' in window && Notification.permission === 'granted') new Notification('yng text · дедлайн', {body, tag: 'yng-' + t.id + '-' + h}); }catch(e){}
        toast(body, 'Открыть', () => openTaskForm({task: t}));
      }
    });
  });
  if(ch) metaSave('tasks');
}

function trowHtml(t){
  const c = taskCls(t), tg = t.tags.map(x => '#' + x).join(' ');
  return `<li class="trow ${isDone(t) ? 'done ' : ''}${c}"><button type="button" class="ck${isDone(t) ? ' on' : ''}" data-tck="${t.id}" aria-label="Отметить выполненной" aria-pressed="${isDone(t)}">${CK}</button>${emPlaque(t)}<span class="tx" data-topen="${t.id}"><b>${esc(t.title)}</b><small>${esc([tNote(t), tg].filter(Boolean).join(' · '))}</small></span>${exBtn(t)}<i class="pd" style="background:${PR[t.prio].c}" title="${PR[t.prio].t}"></i>${exPanel(t)}</li>`;
}
function hotHtml(t){
  const now = Date.now(), over = t.due < now;
  const col = over ? '#ff3b30' : (t.due - now < 12 * 3600e3 ? '#ff6a1a' : '#ff9f0a');
  const when = over ? 'просрочено на ' + relTime(now - t.due) : 'через ' + relTime(t.due - now);
  return `<li class="trow ${over ? 'over' : 'hot'}"><i class="hotm" style="background:${col}"></i><button type="button" class="ck" data-tck="${t.id}" aria-label="Отметить выполненной" aria-pressed="false">${CK}</button>${emPlaque(t)}<span class="tx" data-topen="${t.id}"><b>${esc(t.title)}</b><small>${esc(dueStr(t) + ' · ' + when)}</small></span><i class="pd" style="background:${PR[t.prio].c}" title="${PR[t.prio].t}"></i></li>`;
}
function fileRow(r, withDate){
  const f = folderOf(r);
  return `<div class="hub-row"><button type="button" class="hub-i" data-fopen="${r.id}"><span class="fico"${f ? ` style="background:${f.color}2e;color:${f.color}"` : ''}>${ico(f ? f.icon : 'file')}</span><span class="nt"><b>${esc(r.title || 'Без названия')}</b><small>${esc(info(r).ex || 'Пустой файл')}</small></span><span class="nm">${esc(withDate ? fmtDate(r.updated) : '')}</span></button></div>`;
}
function recents(){
  let ids = store.get('yng-recent', []);
  if(!Array.isArray(ids)) ids = [];
  const seen = new Set(), out = [];
  ids.forEach(id => { if(DR[id] && !seen.has(id)){ seen.add(id); out.push(DR[id]); } });
  Object.values(DR).sort((a, b) => b.updated - a.updated).forEach(r => { if(!seen.has(r.id)){ seen.add(r.id); out.push(r); } });
  const vf = new Set(visFiles().map(r => r.id));
  return out.filter(r => vf.has(r.id)).slice(0, 5);
}
function touchRecent(id){
  let ids = store.get('yng-recent', []); if(!Array.isArray(ids)) ids = [];
  store.set('yng-recent', [id].concat(ids.filter(x => x !== id)).slice(0, 20));
}

      <form class="qa" id="hQa"><input id="hQin" type="text" maxlength="200" placeholder="Новая задача на сегодня — Enter" autocomplete="off" aria-label="Новая задача"><button type="submit" class="btn small">Добавить</button></form>
      ${today.length ? `<ul class="trows">${today.map(trowHtml).join('')}</ul>` : '<div class="wd-e">На сегодня задач нет — добавьте первую выше.</div>'}
      ${notes.length ? `<div class="wd-s">Заметки на сегодня</div><div>${notes.map(r => fileRow(r)).join('')}</div>` : ''}
    </section>
    <section class="wd"><div class="wd-h"><h2>Горящие дедлайны</h2><span class="cnt">${hot.length || ''}</span></div>
      ${hot.length ? `<ul class="trows">${hot.map(hotHtml).join('')}</ul>` : '<div class="wd-e">Ничего не горит — ближайшие 48 часов свободны от дедлайнов.</div>'}
    </section>
    <section class="wd wide"><div class="wd-h"><h2>Быстрый доступ к текстам</h2><small><a href="#/files">Все файлы</a></small></div>

      ${rec.length ? `<div class="hub">${rec.map(r => fileRow(r, true)).join('')}</div>` : '<div class="wd-e">Пока нет файлов. <a href="#/edit">Открыть редактор</a></div>'}
    </section>
  </div>`;
  tickHome(true);

function tickHome(force){
  if(view !== 'home') return;
  const now = new Date();
  if(!force && dkey(now) !== homeKey){ renderHome(); return; }
  const per = periodOf(now.getHours());
  const d = $('#hDate'), t = $('#hTime'); if(!d || !t) return;
  d.textContent = WDL[now.getDay()] + ', ' + now.getDate() + ' ' + MONG[now.getMonth()];
  t.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  if(per.k !== homePer || force){
    homePer = per.k;
    $('#hTxt').textContent = per.t; $('#hIco').innerHTML = ico(per.i); $('#hBlob').style.background = per.c;
  }

/* ================= TASKS ================= */
const T = Object.assign({mode: 'list', group: 'date', hideDone: false}, store.get('yng-tv', {}));
const saveT = () => store.set('yng-tv', T);
function dayLabel(k){
  const d = fromKey(k), n = new Date(), t0 = dkey(n), t1 = dkey(new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1));
  const base = d.getDate() + ' ' + MONG[d.getMonth()] + ', ' + WDL[d.getDay()];
  return k === t0 ? 'Сегодня · ' + d.getDate() + ' ' + MONG[d.getMonth()] : k === t1 ? 'Завтра · ' + d.getDate() + ' ' + MONG[d.getMonth()] : base;
}
function groupsOf(arr){
  const g = [];
  const add = (label, items, cls) => { if(items.length) g.push({label, items, cls: cls || ''}); };
  if(T.group === 'prio'){
    PRK.forEach(p => add(PR[p].t + ' приоритет', arr.filter(t => t.prio === p)));
  } else if(T.group === 'tag'){
    const tags = {}; arr.forEach(t => t.tags.forEach(x => (tags[x] = tags[x] || []).push(t)));
    Object.keys(tags).sort((a, b) => a.localeCompare(b, 'ru')).forEach(x => add('#' + x, tags[x]));
    add('Без тегов', arr.filter(t => !t.tags.length));
  } else {
    const open = arr.filter(t => !isDone(t)), done = arr.filter(isDone);
    add('Просрочено', open.filter(isOver).sort(byDue), 'over');
    const rest = open.filter(t => !isOver(t)), days = {};
    rest.forEach(t => { const k = tDay(t); if(k) (days[k] = days[k] || []).push(t); });
    Object.keys(days).sort().forEach(k => add(dayLabel(k), days[k].sort(byDue)));
    add('Без срока', rest.filter(t => !tDay(t)));
    add('Завершено', done.sort((a, b) => (b.due || 0) - (a.due || 0)));
  }
  return g;
}
function kanbanHtml(arr){
  return `<div class="kb">${STK.map(s => {
    const items = arr.filter(t => t.status === s).sort(byDue);
    return `<div class="kcol" data-col="${s}"><div class="kh"><span>${ST_K[s]}</span><span>${items.length}</span></div>${items.map(t => `<div class="kc ${taskCls(t)} ${isDone(t) ? 'done' : ''}" draggable="true" data-kc="${t.id}" data-topen="${t.id}" style="--c:${PR[t.prio].c}"><b>${emPlaque(t, 1)}${esc(t.title)}</b><small>${esc([tNote(t), t.tags.map(x => '#' + x).join(' ')].filter(Boolean).join(' · ') || PR[t.prio].t)}</small></div>`).join('')}</div>`;
  }).join('')}</div>`;
}
function renderTasks(){

  const arr = T.hideDone ? all.filter(t => !isDone(t)) : all;

  let body;

  else if(T.mode === 'kanban') body = kanbanHtml(arr);
  else body = groupsOf(arr).map(g => `<div class="grp ${g.cls}"><span>${esc(g.label)} · ${g.items.length}</span><i></i></div><ul class="trows tl-list">${g.items.map(trowHtml).join('')}</ul>`).join('') || '<div class="wd-e">Все задачи выполнены.</div>';
  vTasks.innerHTML = `<div class="eyebrow" style="margin-bottom:8px">Планирование</div><h1 class="fl-h1">Задачи</h1>
  <p class="lead">${all.length ? `Открыто: ${open}${over ? ` · просрочено: ${over}` : ''}.` : ''} Дедлайны, приоритеты и связи с вашими заметками.</p>
  ${tagBar()}
  <div class="np-bar"><form class="qa grow" id="tkQa" style="margin:0"><input id="tkIn" type="text" maxlength="200" placeholder="Новая задача — Enter (теги пишите прямо в тексте: #учеба)" autocomplete="off" aria-label="Новая задача"><button type="submit" class="btn small">Добавить</button></form><button class="btn small ghost" id="tkNew" type="button">Подробно…</button></div>
  <div class="chips">${ch(T.mode === 'list', 'data-mode="list"', 'Списки')}${ch(T.mode === 'kanban', 'data-mode="kanban"', 'Канбан')}<span class="sp"></span>
  ${T.mode === 'list' ? ch(T.group === 'date', 'data-grp="date"', 'По дедлайну') + ch(T.group === 'prio', 'data-grp="prio"', 'По приоритету') + ch(T.group === 'tag', 'data-grp="tag"', 'По тегам') : ''}${ch(T.hideDone, 'data-hd="1"', 'Скрыть завершённые')}</div>
  <div id="tkBody">${body}</div>`;
  $('#tkQa').addEventListener('submit', e => { e.preventDefault(); const i = $('#tkIn'); if(createQuick(i.value)){ renderTasks(); $('#tkIn').focus(); } else i.focus(); });
  $('#tkNew').onclick = () => openTaskForm({});
}
vTasks.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]'), g = e.target.closest('[data-grp]'), h = e.target.closest('[data-hd]');
  if(m){ T.mode = m.dataset.mode; saveT(); renderTasks(); }

/* kanban drag & drop */
let dragTask = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-kc]'); if(!c) return;
  dragTask = c.dataset.kc; e.dataTransfer.setData('text/yng-task', dragTask); e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragend', () => { dragTask = null; document.querySelectorAll('.kcol.over,.ftile.over,.trash-fab.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.kcol');
  if(col && dragTask){ e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); }
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.kcol');
  if(!col || !dragTask) return;
  e.preventDefault();
  const t = M.tasks.find(x => x.id === dragTask); dragTask = null;
  if(!t || t.status === col.dataset.col) { col.classList.remove('over'); return; }
  t.status = col.dataset.col; if(isDone(t)) t.fired = {};
  saveTasks(); renderTasks();
});


/* ================= CALENDAR ================= */
const C = Object.assign({mode: 'month'}, store.get('yng-cal', {}));
C.d = new Date(); C.sel = dkey(new Date());
const saveC = () => store.set('yng-cal', {mode: C.mode});
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const tasksOn = k => visTasks().filter(t => tDay(t) === k).sort(byDue);
const filesOn = k => visFiles().filter(r => r.date === k);
function dayPanel(k){
  const ts = tasksOn(k), fs = filesOn(k), d = fromKey(k);
  return `<div class="dp"><h3>${d.getDate()} ${MONG[d.getMonth()]}, ${WDL[d.getDay()]}</h3>
    ${ts.length ? `<ul class="trows">${ts.map(trowHtml).join('')}</ul>` : '<div class="wd-e">На этот день задач нет.</div>'}
    <div class="wd-s">Заметки этого дня</div>
    ${fs.length ? `<div>${fs.map(r => fileRow(r)).join('')}</div>` : '<div class="wd-e">Файлов, закреплённых за этим днём, нет — например, лекции или записи дневника.</div>'}
    <div class="acts"><button type="button" class="btn small" data-cnew="${k}">Задача на этот день</button><button type="button" class="btn small ghost" data-cnote="${k}">Новая заметка</button><button type="button" class="btn small ghost" data-cpin="${k}">Закрепить файл</button></div></div>`;
}
function dotsFor(k){
  const ts = tasksOn(k), fs = filesOn(k), max = 6, parts = [];
  ts.slice(0, max).forEach(t => parts.push(`<i class="${isDone(t) ? 'dn' : ''}" style="background:${isOver(t) ? '#ff3b30' : PR[t.prio].c}"></i>`));
  fs.slice(0, Math.max(0, max - parts.length)).forEach(() => parts.push('<i class="fm"></i>'));
  const more = ts.length + fs.length - parts.length;
  return `<span class="dots">${parts.join('')}${more > 0 ? `<em>+${more}</em>` : ''}</span>`;
}
function calTitle(){
  const d = C.d;
  if(C.mode === 'month') return MONN[d.getMonth()] + ' ' + d.getFullYear();
  if(C.mode === 'week'){ const a = mondayOf(d), b = addDays(a, 6); return a.getDate() + (a.getMonth() !== b.getMonth() ? ' ' + MONG[a.getMonth()] : '') + ' – ' + b.getDate() + ' ' + MONG[b.getMonth()] + ' ' + b.getFullYear(); }
  return d.getDate() + ' ' + MONG[d.getMonth()] + ' ' + d.getFullYear() + ', ' + WDL[d.getDay()];
}
function monthHtml(){
  const d = C.d, y = d.getFullYear(), m = d.getMonth(), first = new Date(y, m, 1), off = (first.getDay() + 6) % 7;
  const rows = Math.ceil((off + new Date(y, m + 1, 0).getDate()) / 7), today = dkey(new Date());
  let h = '<div class="cm">' + [1, 2, 3, 4, 5, 6, 0].map(i => `<div class="cwd">${WDS[i]}</div>`).join('');
  for(let i = 0; i < rows * 7; i++){
    const x = new Date(y, m, 1 - off + i), k = dkey(x);
    h += `<button type="button" class="cd${x.getMonth() !== m ? ' o' : ''}${k === today ? ' t' : ''}${k === C.sel ? ' s' : ''}" data-cday="${k}" aria-label="${x.getDate()} ${MONG[x.getMonth()]}"><b>${x.getDate()}</b>${dotsFor(k)}</button>`;
  }
  return h + '</div><div class="mt">' + dayPanel(C.sel) + '</div>';
}
function weekHtml(){
  const a = mondayOf(C.d), today = dkey(new Date());
  const days = Array.from({length: 7}, (_, i) => addDays(a, i)), keys = days.map(dkey);
  const wt = visTasks().filter(t => keys.includes(tDay(t)));
  const open = wt.filter(t => !isDone(t)), over = wt.filter(isOver).length;
  const nf = visFiles().filter(r => keys.includes(r.date)).length;
  const focus = open.slice().sort((x, y) => PRK.indexOf(x.prio) - PRK.indexOf(y.prio) || (x.due || 9e15) - (y.due || 9e15))[0];
  let h = `<p class="wk-sum">Задач на неделе: ${wt.length} (открыто ${open.length}${over ? ', просрочено ' + over : ''}) · заметок: ${nf}${focus ? ` · фокус: <b>${esc(focus.title)}</b>` : ''}</p><div class="cw">`;
  days.forEach((d, i) => {
    const k = keys[i], ts = tasksOn(k), fs = filesOn(k);
    h += `<div class="cwc${k === today ? ' t' : ''}${k === C.sel ? ' s' : ''}"><button type="button" class="cwh" data-cday="${k}"><span>${WDS[d.getDay()]}</span><b>${d.getDate()}</b></button><div class="load"><i style="width:${Math.min(100, ts.length * 18)}%"></i></div>`
      + ts.map(t => `<div class="cwi ${isDone(t) ? 'done' : ''} ${isOver(t) ? 'over' : ''}" style="--c:${PR[t.prio].c}" data-topen="${t.id}">${emPlaque(t, 1)}${t.tm ? hm(t.due) + ' ' : ''}${esc(t.title)}${subsList(t, 's')}${attList(t, 's')}</div>`).join('')
      + fs.map(r => `<div class="cwi f" data-fopen="${r.id}">${esc(r.title || 'Без названия')}</div>`).join('') + '</div>';
  });
  return h + '</div><div class="mt">' + dayPanel(C.sel) + '</div>';
}
function dayHtml(){
  const k = dkey(C.d), ts = tasksOn(k), fs = filesOn(k), nowH = new Date().getHours(), isToday = k === dkey(new Date());
  const item = t => `<div class="cwi ${isDone(t) ? 'done' : ''} ${isOver(t) ? 'over' : ''}" style="--c:${PR[t.prio].c}" data-topen="${t.id}">${emPlaque(t, 1)}${t.tm ? hm(t.due) + ' ' : ''}${esc(t.title)}${subsList(t, 's')}${attList(t, 's')}</div>`;
  let rows = `<div class="hr"><span>день</span><div class="hc" data-chour="">${ts.filter(t => !t.tm).map(item).join('')}${fs.map(r => `<div class="cwi f" data-fopen="${r.id}">${esc(r.title || 'Без названия')}</div>`).join('')}</div></div>`;
  for(let h = 0; h < 24; h++) rows += `<div class="hr${isToday && h === nowH ? ' now' : ''}" data-hr="${h}"><span>${pad(h)}:00</span><div class="hc" data-chour="${h}">${ts.filter(t => t.tm && new Date(t.due).getHours() === h).map(item).join('')}</div></div>`;
  return `<div class="cdy"><div class="tml" id="tml">${rows}</div>${dayPanel(k)}</div>`;
}
function renderCal(){
  vCal.innerHTML = `<div class="eyebrow" style="margin-bottom:8px">Планирование</div><h1 class="fl-h1">Календарь</h1>${tagBar()}
  <div class="cal-h"><h2>${esc(calTitle())}</h2><button type="button" class="icon-btn" data-cnav="-1" aria-label="Назад">${ico('back')}</button><button type="button" class="btn small ghost" data-cnav="0">Сегодня</button><button type="button" class="icon-btn" data-cnav="1" aria-label="Вперёд">${ico('fwd')}</button><span class="sp"></span>
  <div class="seg">${[['month', 'Месяц'], ['week', 'Неделя'], ['day', 'День']].map(([k, t]) => `<button type="button" data-cm="${k}" class="${C.mode === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
  ${C.mode === 'month' ? monthHtml() : C.mode === 'week' ? weekHtml() : dayHtml()}`;
  const tml = $('#tml');
  if(tml){ const r = tml.querySelector(`[data-hr="${dkey(C.d) === dkey(new Date()) ? Math.max(0, new Date().getHours() - 1) : 7}"]`); if(r) tml.scrollTop = r.offsetTop - tml.offsetTop; }
}
vCal.addEventListener('click', e => {
  const q = s => e.target.closest(s);
  let el;
  if((el = q('[data-cnav]'))){
    const n = +el.dataset.cnav, d = C.d;
    if(n === 0) C.d = new Date();
    else if(C.mode === 'month') C.d = new Date(d.getFullYear(), d.getMonth() + n, 1);
    else C.d = addDays(d, n * (C.mode === 'week' ? 7 : 1));
    C.sel = C.mode === 'day' || n === 0 ? dkey(C.d) : (C.mode === 'month' ? dkey(C.d) : dkey(mondayOf(C.d)));
    renderCal();
  }
  else if((el = q('[data-cm]'))){ C.mode = el.dataset.cm; if(C.mode === 'day') C.d = fromKey(C.sel); saveC(); renderCal(); }
  else if((el = q('[data-cday]'))){
    C.sel = el.dataset.cday;
    if(C.mode === 'week' || C.mode === 'month') { if(C.mode === 'month') C.d = fromKey(C.sel); }
    renderCal();
  }
  else if((el = q('[data-cnew]'))) openTaskForm({preset: {due: endOfDay(el.dataset.cnew)}});
  else if((el = q('[data-cnote]'))) newDatedDraft(el.dataset.cnote);
  else if((el = q('[data-cpin]'))) pinFileToDay(el.dataset.cpin);
  else if((el = q('[data-chour]')) && !q('[data-topen],[data-fopen]')){

/* ================= GLOBAL SEARCH ================= */
function hl(text, terms){
  const n = norm(text), ranges = [];
  terms.forEach(t => { let p = 0; while(t && (p = n.indexOf(t, p)) >= 0){ ranges.push([p, p + t.length]); p += t.length; } });
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  ranges.forEach(r => { const l = merged[merged.length - 1]; if(l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); });
  let out = '', i = 0;
  merged.forEach(([a, b]) => { out += esc(text.slice(i, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; i = b; });
  return out + esc(text.slice(i));
}
function snippet(text, terms){
  const n = norm(text); let at = -1;
  for(const t of terms){ const p = n.indexOf(t); if(p >= 0 && (at < 0 || p < at)) at = p; }
  const s = Math.max(0, at - 40);
  return (s > 0 ? '…' : '') + text.slice(s, s + 130) + (s + 130 < text.length ? '…' : '');
}
function runSearch(q){
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if(!terms.length) return {files: [], tasks: [], terms};
  const all = h => terms.every(t => h.includes(t));
  const files = visFiles().map(r => ({r, text: info(r).text})).filter(x => all(norm((x.r.title || '') + ' ' + x.text + ' ' + (x.r.tags || []).join(' ')))).sort((a, b) => b.r.updated - a.r.updated).slice(0, 30);
  const tasks = visTasks().filter(t => all(norm(t.title + ' ' + t.desc + ' ' + t.subs.map(s => s.t).join(' ') + ' ' + t.tags.join(' ')))).slice(0, 30);
  return {files, tasks, terms};
}

const WPD = () => ({img: null, dim: 0, blur: 0});
M.wp = {light: WPD(), dark: WPD(), hero: false};
const wpClamp = (v, a, b) => Math.max(a, Math.min(b, +v || 0));
let wpShown = null, wpTab = 'light', wpPop = null, wpT = null;
async function wpLoad(){
  let v = null;
  try{
    if(mdb){ const row = await mtx('readonly', s => s.get('wp')); v = row && row.v; }
    else v = JSON.parse(localStorage.getItem('yng-m-wp') || 'null');
  }catch(e){}
  if(v && typeof v === 'object'){
    ['light', 'dark'].forEach(k => {
      const o = v[k] || {};
      M.wp[k] = {img: typeof o.img === 'string' && /^data:image\/(jpeg|png|webp);/.test(o.img) ? o.img : null, dim: wpClamp(o.dim, 0, 100), blur: wpClamp(o.blur, 0, 30)};
    });
    M.wp.hero = !!v.hero;
  }
  applyWp();
}
function wpSave(now){
  clearTimeout(wpT);
  const go = async () => {
    try{ if(mdb) await mtx('readwrite', s => s.put({k: 'wp', v: M.wp})); else localStorage.setItem('yng-m-wp', JSON.stringify(M.wp)); }
    catch(e){ toast('Не удалось сохранить обои: возможно, изображение слишком большое для памяти браузера'); }

  const w = M.wp[curTheme()] || WPD(), el = $('#wp'), has = !!w.img;

  el.hidden = !has;
  if(has){
    const im = el.firstElementChild;
    if(wpShown !== w.img){ im.style.backgroundImage = 'url("' + w.img + '")'; wpShown = w.img; }
    im.style.filter = w.blur ? 'blur(' + w.blur + 'px)' : 'none';
    el.lastElementChild.style.background = 'rgba(0,0,0,' + (w.dim / 100) + ')';

try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyWp); }catch(e){}

async function wpCompress(file){
  const src = await readFile(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const MAX = 2560, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, MAX / Math.max(w, h));

  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  let out = c.toDataURL('image/webp', .86);
  if(!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', .86);
  return out;
}

const emKey = s => String(s || '').replace(/️/g, '');
const emNorm = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
const EMSET = new Set(), EMLIST = [];
EMC.forEach(([cn, list]) => list.forEach(([ch, kw]) => { EMSET.add(emKey(ch)); EMLIST.push({ch, cat: cn, s: emNorm(kw + ' ' + cn)}); }));
/* Слот под Apple-эмодзи: если до загрузки сайта задать window.YNG_EMOJI_SPRITE = {url, cols, rows, map: {'😀': [col, row], ...}},
   то все эмодзи рисуются из этого спрайта (в стиле iOS) вместо системного шрифта. */
const EMSPR = (typeof window.YNG_EMOJI_SPRITE === 'object' && window.YNG_EMOJI_SPRITE && window.YNG_EMOJI_SPRITE.url) ? window.YNG_EMOJI_SPRITE : null;

function emGlyph(ch){
  const pos = EMSPR && EMSPR.map && EMSPR.map[emKey(ch)];
  if(pos) return `<i class="em-i" role="img" aria-label="${esc(ch)}" style="background-size:${EMSPR.cols * 100}% ${EMSPR.rows * 100}%;background-position:${EMSPR.cols > 1 ? pos[0] / (EMSPR.cols - 1) * 100 : 0}% ${EMSPR.rows > 1 ? pos[1] / (EMSPR.rows - 1) * 100 : 0}%"></i>`;
  return `<span class="em">${esc(ch)}</span>`;
}
const EMTAGS = [[/уч[её]б|лекц|экзам|универ|школ|курс/, '📚'], [/диплом|курсов|реферат/, '🎓'], [/работ|проект|офис|клиент/, '💼'], [/код|разраб|программ|баг|сайт/, '💻'], [/дом|быт|убор|ремонт/, '🏠'], [/спорт|трен|зал|бег/, '🏃'], [/здоров|врач|больн|лекарств/, '🩺'], [/покуп|магазин|продукт/, '🛒'], [/финанс|деньг|бюджет|счёт|счет|налог/, '💰'], [/встреч|звонок|созвон/, '🤝'], [/иде[яи]/, '💡'], [/путешеств|отпуск|поездк|билет/, '✈️'], [/семь|друз|родител/, '👨‍👩‍👧'], [/важн|срочн/, '❗'], [/личн/, '⭐']];
function emTagDefault(t){
  for(const tag of (t.tags || [])){ const g = emNorm(tag); for(const [re, ch] of EMTAGS) if(re.test(g)) return ch; }
  return '';
}
const taskEmoji = t => (t.emoji && EMSET.has(emKey(t.emoji)) ? t.emoji : '') || emTagDefault(t) || '📄';
const emPlaque = (t, small) => `<span class="emp${small ? ' s' : ''}" aria-hidden="true">${emGlyph(taskEmoji(t))}</span>`;

function openEmojiPicker(current){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'emp-ov';
    ov.innerHTML = `<div class="emp-box" role="dialog" aria-modal="true" aria-label="Выбор эмодзи">
      <div class="emp-top"><input type="search" id="emQ" placeholder="Поиск: книга, работа, дом…" autocomplete="off"><button type="button" class="icon-btn" data-emx aria-label="Закрыть">${ico('x')}</button></div>
      <div class="emp-tabs">${EMC.map((c, i) => `<button type="button" data-emc="${i}" title="${esc(c[0])}">${emGlyph(c[1][0][0])}</button>`).join('')}</div>
      <div class="emp-body" id="emBody"></div>
      <div class="emp-foot"><span id="emCur"></span><button type="button" class="btn small neutral" data-emreset>По умолчанию</button></div></div>`;
    document.body.appendChild(ov);
    const body = ov.querySelector('#emBody'), q = ov.querySelector('#emQ');
    const btn = e => `<button type="button" class="emb${current && emKey(current) === emKey(e.ch) ? ' on' : ''}" data-em="${esc(e.ch)}" title="${esc(e.ch)}">${emGlyph(e.ch)}</button>`;
    const draw = () => {
      const tk = emNorm(q.value).split(/\s+/).filter(Boolean);
      if(!tk.length){
        body.innerHTML = EMC.map((c, i) => `<h4 data-sec="${i}">${esc(c[0])}</h4><div class="emg">${c[1].map(e => btn({ch: e[0]})).join('')}</div>`).join('');
        return;
      }
      const hit = EMLIST.filter(e => tk.every(w => e.s.includes(w)));
      const by = {}; hit.forEach(e => { (by[e.cat] = by[e.cat] || []).push(e); });
      body.innerHTML = hit.length ? Object.keys(by).map(k => `<h4>${esc(k)}</h4><div class="emg">${by[k].map(btn).join('')}</div>`).join('') : '<div class="emp-none">Ничего не найдено — попробуйте другое слово</div>';
      body.scrollTop = 0;
    };
    let done = false;
    const finish = v => { if(done) return; done = true; window.removeEventListener('keydown', kd, true); ov.remove(); res(v); };
    const kd = e => { if(e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); finish(undefined); } };
    window.addEventListener('keydown', kd, true);
    ov.addEventListener('click', e => {
      if(e.target === ov || e.target.closest('[data-emx]')) return finish(undefined);
      if(e.target.closest('[data-emreset]')) return finish('');
      const b = e.target.closest('[data-em]'); if(b) return finish(b.dataset.em);
      const t = e.target.closest('[data-emc]');
      if(t){ q.value = ''; draw(); const h = body.querySelector('[data-sec="' + t.dataset.emc + '"]'); if(h) body.scrollTop = h.offsetTop - body.offsetTop; }
    });
    q.addEventListener('input', draw);
    draw(); setTimeout(() => q.focus(), 30);
  });
}

    const x0 = Math.min(...boxes.map(b => b.x)), y0 = Math.min(...boxes.map(b => b.y)), x1 = Math.max(...boxes.map(b => b.x + b.w)), y1 = Math.max(...boxes.map(b => b.y + b.h));

  }

  const key = bd.sel.join() + '|' + [o.type, o.c, o.kind, o.hl, o.w, o.h, same, !!bd.editing, !!o.route].join();

function bdPbClick(e){

/* ---------- cards: add file/task, images ---------- */
function bdAddRef(kind, ref, pt){
  const ex = BD.objs.find(o => o.type === kind && o.ref === ref);
  if(ex){ toast('Эта карточка уже есть на холсте'); bdFocusObj(ex.id); return; }
  const [w, h] = kind === 'file' ? (isDeck(DR[ref]) ? [400, 300] : [320, 280]) : [280, 96];
  const o = bdFix({id: uid(), type: kind, ref, x: bdSnap(pt.x - w / 2), y: bdSnap(pt.y - h / 2), w, h});
  if(o){ bdTool('select'); bdAdd(o); bdSideDraw(); bdSave(); }
}
async function bdAddImages(files, pt){
  files = Array.from(files).filter(f => /^image\//.test(f.type));
  if(!files.length){ toast('Подойдут только изображения'); return; }
  const ids = []; let n = 0;
  for(const f of files){
    try{
      const uri = await compress(f);
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = uri; });
      const nw = im.naturalWidth || 300, nh = im.naturalHeight || 200, w = Math.min(nw, 360), h = w * nh / nw;
      const o = bdFix({id: uid(), type: 'image', x: bdSnap(pt.x - w / 2 + n * 30), y: bdSnap(pt.y - h / 2 + n * 30), w, h, src: uri, ratio: nw / nh});
      if(o){ BD.objs.push(o); bdSync(o, false); ids.push(o.id); } n++;
    }catch(e){ toast('Не удалось обработать изображение «' + (f.name || 'вставка') + '»'); }
  }
  if(ids.length){ bdTool('select'); bdSelect(ids); bdDirty(); bdSave(); }
}

/* ---------- minimap ---------- */
function bdMiniSoon(){
  if(bd.mmRaf) return;
  bd.mmRaf = requestAnimationFrame(() => { bd.mmRaf = 0; bdMiniDraw(); });
}
function bdMiniDraw(){
  const c = $('#bdMini'); if(!c || view !== 'board') return;
  $('#bdHint').hidden = BD.objs.length > 0;
  const W = c.clientWidth, H = c.clientHeight, dpr = devicePixelRatio || 1; if(!W || !H) return;
  if(c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)){ c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const v = BD.view, vp = {x: -v.x / v.k, y: -v.y / v.k, w: bd.W / v.k, h: bd.H / v.k};
  let b = bd.mmFix;
  if(!b){
    b = vp;
    if(BD.objs.length){ const a = bdAllBox(); const x0 = Math.min(a.x, vp.x), y0 = Math.min(a.y, vp.y), x1 = Math.max(a.x + a.w, vp.x + vp.w), y1 = Math.max(a.y + a.h, vp.y + vp.h); b = {x: x0, y: y0, w: x1 - x0, h: y1 - y0}; }
  }
  const s = Math.min((W - 10) / b.w, (H - 10) / b.h), ox = (W - b.w * s) / 2 - b.x * s, oy = (H - b.h * s) / 2 - b.y * s;
  bd.mm = {s, ox, oy, b};
  const cs = getComputedStyle(document.documentElement), tx = cs.getPropertyValue('--text-3').trim() || '#888', ac = cs.getPropertyValue('--accent').trim() || '#06c';
  BD.objs.forEach(o => {
    if(o.type === 'draw'){ ctx.strokeStyle = o.hl ? 'rgba(255,200,0,.6)' : (o.c === '#1d1d1f' ? tx : o.c); ctx.lineWidth = Math.max(1, o.w * s); ctx.beginPath(); o.pts.forEach((p, i) => { const X = p[0] * s + ox, Y = p[1] * s + oy; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); return; }
    if(o.type === 'arrow'){ ctx.strokeStyle = tx; ctx.lineWidth = 1; ctx.beginPath(); bdRoute(o).forEach((q, i) => { const X = q.x * s + ox, Y = q.y * s + oy; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); return; }
    const x = o.x * s + ox, y = o.y * s + oy, w = Math.max(2, o.w * s), h = Math.max(2, o.h * s);
    if(o.type === 'frame'){ ctx.strokeStyle = tx; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h); return; }
    ctx.fillStyle = o.c || (o.type === 'image' ? tx : 'rgba(150,150,160,.55)'); ctx.fillRect(x, y, w, h);
  });
  const x = vp.x * s + ox, y = vp.y * s + oy, w = vp.w * s, h = vp.h * s;
  ctx.fillStyle = 'rgba(0,102,204,.10)'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = ac; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
}
function bdMiniGo(e){
  const c = $('#bdMini'), m = bd.mm; if(!m) return;
  const r = c.getBoundingClientRect(), wx = (e.clientX - r.left - m.ox) / m.s, wy = (e.clientY - r.top - m.oy) / m.s;
  BD.view.x = bd.W / 2 - wx * BD.view.k; BD.view.y = bd.H / 2 - wy * BD.view.k; bdApplyView(); bd.dirty = true;
}

/* ---------- enter / leave ---------- */
function bdMeasure(){ const r = bdV().getBoundingClientRect(); bd.W = r.width; bd.H = r.height; }
function bdEnter(){
  bdMeasure();
  if(!bd.centered){ bd.centered = true; bdPageView(); bdPageSync(); }
  bdHistInit(); bdPagesDraw();
  if(!bd.editing) bdRenderAll();
  bdTool(bd.tool === 'image' ? 'select' : bd.tool);

  setTimeout(() => { try{ bdV().focus({preventScroll: true}); }catch(e){} }, 30);
}
function bdLeave(){
  if(bd.editing) bdEditEnd();
  dr = null; bdAnchHide(); closePop(); bdSave(true);
}
function bdMerge(b){
  if(!b) return 0;
  bdPageSync(); let n = 0;
  if(Array.isArray(b.pages)){
    b.pages.map(bdFixPage).filter(Boolean).forEach(pg => {
      const ex = BDX.pages.find(p => p.id === pg.id);
      if(!ex){ BDX.pages.push(pg); n += pg.objs.length || 1; }
      else pg.objs.forEach(o => { if(!ex.objs.some(x => x.id === o.id)){ ex.objs.push(o); n++; } });
    });
  } else if(Array.isArray(b.objs)) b.objs.map(bdFix).filter(Boolean).forEach(o => { if(!bdGet(o.id)){ BD.objs.push(o); n++; } });
  const cp = bdCurPage(); if(cp) BD.objs = cp.objs;
  if(n){ bd.dirty = true; bdSave(true); if(view === 'board'){ bdPagesDraw(); bdRenderAll(); } }
  return n;
}

/* ---------- wiring ---------- */
function bdWire(){

  v.addEventListener('pointermove', e => { bdOnMove(e); bdOnHover(e); });
  v.addEventListener('pointerup', bdOnUp); v.addEventListener('pointercancel', bdOnUp);

/* ================= v6: files store, subtasks view, attachments ================= */
const FMAX = 15 * 1024 * 1024;
const fmtSize = n => n < 1024 ? n + ' Б' : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0).replace('.', ',') + ' КБ' : (n / 1048576).toFixed(1).replace('.', ',') + ' МБ';
const CLIP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.5 17.2a1.7 1.7 0 0 1-2.4-2.4L14.5 7.5"/></svg>';
let fdb = null; const fmem = new Map();
const fdbReady = new Promise(res => {
  try{
    if(!window.indexedDB) return res();
    const r = indexedDB.open('yng-text-files', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('blobs', {keyPath: 'id'}); };
    r.onsuccess = () => { fdb = r.result; res(); };
    r.onerror = () => res(); r.onblocked = () => res();
  }catch(e){ res(); }
});
const ftx = (mode, fn) => new Promise((ok, no) => { const t = fdb.transaction('blobs', mode); const q = fn(t.objectStore('blobs')); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); t.onabort = () => no(t.error); });
async function fsPut(file){
  await fdbReady;
  const rec = {id: uid(), name: (file.name || 'файл').slice(0, 200), size: file.size, type: (file.type || '').slice(0, 100), blob: file};
  if(fdb){ try{ await ftx('readwrite', s => s.put(rec)); }catch(e){ fmem.set(rec.id, rec); } } else fmem.set(rec.id, rec);
  return {id: rec.id, name: rec.name, size: rec.size, type: rec.type};
}
async function fsGet(id){
  await fdbReady;
  if(fmem.has(id)) return fmem.get(id).blob;
  if(!fdb) return null;
  try{ const r = await ftx('readonly', s => s.get(id)); return r ? r.blob : null; }catch(e){ return null; }
}
async function fsDel(id){ await fdbReady; fmem.delete(id); if(fdb){ try{ await ftx('readwrite', s => s.delete(id)); }catch(e){} } }
async function fsDownload(meta){
  const b = await fsGet(meta.id);
  if(!b){ toast('Файл не найден в хранилище этого браузера'); return; }
  await yngSave(b, meta.name || 'file');
}
/* выбрать файлы с устройства и сохранить: вернёт массив метаданных */
function pickFiles(multiple){
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.multiple = multiple !== false; i.style.display = 'none';
    i.addEventListener('change', async () => { const r = await saveFiles(Array.from(i.files || [])); i.remove(); res(r); });
    i.addEventListener('cancel', () => { i.remove(); res([]); });
    document.body.appendChild(i); i.click();
  });
}
async function saveFiles(files){
  const out = [];
  for(const f of files){
    if(f.size > FMAX){ toast('«' + f.name + '» больше 15 МБ — не добавлен'); continue; }
    if(!f.size){ toast('«' + f.name + '» пустой — не добавлен'); continue; }
    try{ out.push(await fsPut(f)); }catch(e){ toast('Не удалось сохранить «' + f.name + '»'); }
  }
  return out;
}

const tblGuide = document.createElement('div'); tblGuide.className = 'tbl-guide'; tblGuide.hidden = true; document.body.appendChild(tblGuide);

const tblSimple = t => !t.querySelector('[colspan],[rowspan]') && t.rows.length > 0;
function tblHitTest(e){
  const T = e.pointerType === 'touch' ? 10 : 5;
  let el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el || !ed.contains(el)) return null;
  const tb = el.closest('table'); if(!tb || !tblSimple(tb)) return null;
  let cell = el.closest('td,th');
  const x = e.clientX, y = e.clientY;
  if(!cell){
    /* курсор на внешней рамке самой таблицы */
    const tr = tb.getBoundingClientRect();
    const lastRow = tb.rows[tb.rows.length - 1], lc = lastRow.cells[lastRow.cells.length - 1], fc = tb.rows[0].cells[0];
    if(Math.abs(x - tr.right) <= T) return {tb, kind: 'col', i: tb.rows[0].cells.length - 1, at: tr.right};
    if(Math.abs(y - tr.bottom) <= T) return {tb, kind: 'row', i: tb.rows.length - 1, at: tr.bottom};
    return null;
  }
  const r = cell.getBoundingClientRect(), ci = cell.cellIndex, ri = cell.parentNode.rowIndex;
  if(Math.abs(x - r.right) <= T) return {tb, kind: 'col', i: ci, at: r.right};
  if(ci > 0 && Math.abs(x - r.left) <= T) return {tb, kind: 'col', i: ci - 1, at: r.left};
  if(Math.abs(y - r.bottom) <= T) return {tb, kind: 'row', i: ri, at: r.bottom};
  if(ri > 0 && Math.abs(y - r.top) <= T) return {tb, kind: 'row', i: ri - 1, at: r.top};
  return null;
}
function tblGuideShow(h){
  if(!h){ tblGuide.hidden = true; return; }
  const tr = h.tb.getBoundingClientRect();
  tblGuide.hidden = false;
  if(h.kind === 'col') Object.assign(tblGuide.style, {left: (h.at - 1) + 'px', top: tr.top + 'px', width: '3px', height: tr.height + 'px'});
  else Object.assign(tblGuide.style, {left: tr.left + 'px', top: (h.at - 1) + 'px', width: tr.width + 'px', height: '3px'});
}
/* колонки хранятся в <colgroup> в процентах от ширины таблицы, сама таблица — в % от ширины страницы */
function tblCols(tb){
  const n = tb.rows[0].cells.length;
  let cg = tb.querySelector(':scope > colgroup');
  if(cg && cg.children.length === n && Array.from(cg.children).every(c => /%/.test(c.style.width))) return cg;
  const px = Array.from(tb.rows[0].cells).map(c => c.getBoundingClientRect().width), sum = px.reduce((a, b) => a + b, 0) || 1;
  if(!cg){ cg = document.createElement('colgroup'); tb.insertBefore(cg, tb.firstChild); }
  cg.innerHTML = '';
  px.forEach(w => { const c = document.createElement('col'); c.style.width = (w / sum * 100).toFixed(3) + '%'; cg.appendChild(c); });
  return cg;
}
function tblSetWidths(tb, px){
  const cw = Math.max(100, tb.parentNode.clientWidth || ed.clientWidth), sum = px.reduce((a, b) => a + b, 0);
  const cg = tb.querySelector(':scope > colgroup'); if(!cg) return;
  tb.style.width = Math.min(100, sum / cw * 100).toFixed(3) + '%';
  Array.from(cg.children).forEach((c, i) => { c.style.width = (px[i] / sum * 100).toFixed(3) + '%'; });
}
function tblRenorm(tb){
  const cg = tb.querySelector(':scope > colgroup'); if(!cg) return;
  const n = tb.rows[0].cells.length;
  while(cg.children.length < n) cg.appendChild(document.createElement('col'));
  while(cg.children.length > n) cg.lastChild.remove();
  const w = Array.from(cg.children).map(c => parseFloat(c.style.width) || 0), have = w.filter(x => x > 0), avg = have.length ? have.reduce((a, b) => a + b, 0) / have.length : 100 / n;
  const f = w.map(x => x > 0 ? x : avg), s = f.reduce((a, b) => a + b, 0) || 1;
  Array.from(cg.children).forEach((c, i) => { c.style.width = (f[i] / s * 100).toFixed(3) + '%'; });
}
ed.addEventListener('pointermove', e => {
  if(tblDrag) return;
  if(e.pointerType === 'touch' || e.buttons){ return; }
  const h = tblHitTest(e); tblHot = h;
  ed.style.cursor = h ? (h.kind === 'col' ? 'col-resize' : 'row-resize') : '';
  tblGuideShow(h);
});
ed.addEventListener('pointerleave', () => { if(!tblDrag){ ed.style.cursor = ''; tblGuideShow(null); tblHot = null; } });
ed.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  const h = tblHitTest(e); if(!h) return;
  e.preventDefault();
  const tb = h.tb;
  if(h.kind === 'col'){
    tblCols(tb);
    const cw = Math.max(100, tb.parentNode.clientWidth || ed.clientWidth);
    const px = Array.from(tb.rows[0].cells).map(c => c.getBoundingClientRect().width);
    tblDrag = {h, tb, px0: px, x0: e.clientX, cw, id: e.pointerId};
  } else {
    const tr = tb.rows[h.i];
    tblDrag = {h, tb, tr, y0: e.clientY, h0: tr.getBoundingClientRect().height, id: e.pointerId};
  }
  try{ ed.setPointerCapture(e.pointerId); }catch(err){}
  document.body.classList.add('tbl-resizing'); document.body.style.cursor = h.kind === 'col' ? 'col-resize' : 'row-resize';
});
ed.addEventListener('mousedown', e => { if(tblDrag || (tblHot && e.button === 0)) e.preventDefault(); });
ed.addEventListener('pointermove', e => {
  if(!tblDrag || e.pointerId !== tblDrag.id) return;
  const d = tblDrag;
  if(d.h.kind === 'col'){
    const px = d.px0.slice(), i = d.h.i, MIN = 36;
    px[i] = Math.max(MIN, d.px0[i] + (e.clientX - d.x0));
    const over = px.reduce((a, b) => a + b, 0) - d.cw;
    if(over > 0) px[i] = Math.max(MIN, px[i] - over);
    tblSetWidths(d.tb, px);
    const r = d.tb.rows[0].cells[i].getBoundingClientRect(); d.h.at = r.right;
  } else {
    d.tr.style.height = Math.round(Math.max(24, d.h0 + (e.clientY - d.y0))) + 'px';
    d.h.at = d.tr.getBoundingClientRect().bottom;
  }

});
const tblEnd = e => {
  if(!tblDrag || (e && e.pointerId !== tblDrag.id)) return;
  const d = tblDrag; tblDrag = null;
  try{ ed.releasePointerCapture(d.id); }catch(err){}

  changed();
};
ed.addEventListener('pointerup', tblEnd); ed.addEventListener('pointercancel', tblEnd);

/* операции со строками/столбцами сохраняют ширины колонок */
function tableOp(op){
  const cell = up(/^T[DH]$/);
  if(!cell) return tableOpBase(op);
  const table = cell.closest('table'), ci = cell.cellIndex;
  if(op === 'tbl-del'){ capRemove(table, 't'); return tableOpBase(op); }
  const cg = table.querySelector(':scope > colgroup');
  tableOpBase(op);
  if(cg && table.isConnected && table.rows.length){
    if(op === 'col-left' || op === 'col-right'){
      const nc = document.createElement('col'), at = op === 'col-left' ? ci : ci + 1;
      cg.insertBefore(nc, cg.children[at] || null);
    } else if(op === 'col-del'){ if(cg.children[ci]) cg.children[ci].remove(); }
    tblRenorm(table);
  }
}

/* ---------- 2. подписи к таблицам и изображениям ---------- */
function capOf(el, kind){

}

function capCreate(el, kind){

function capTable(){

function imgBlock(im){ let b = im; while(b && b.parentNode !== ed) b = b.parentNode; return b; }
function capNorm(){

function capUiSync(){

let capLast = null;

ed.addEventListener('keydown', e => {

/* ---------- 3. файлы-вложения в тексте ---------- */
function fwFix(p){

}

/* ---------- 4. редактор формул ---------- */
const FX_GREEK_L = 'α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ τ υ φ χ ψ ω ϑ ϕ ϰ ϱ ς ϖ'.split(' ');
const FX_GREEK_U = 'Γ Δ Θ Λ Ξ Π Σ Φ Ψ Ω Υ'.split(' ');
const FX_SYM = {
  'Операции': '+ − ± ∓ · × ÷ ∗ ∘ ⊕ ⊗ ∕ √ ∛ % ‰ °'.split(' '),
  'Отношения': '= ≠ ≈ ≡ ≅ ∼ ∝ < > ≤ ≥ ≪ ≫ ⊥ ∥ ∠'.split(' '),
  'Стрелки': '→ ← ↔ ⇒ ⇐ ⇔ ↦ ↑ ↓ ⟶ ⟵'.split(' '),
  'Множества и логика': '∈ ∉ ∋ ⊂ ⊆ ⊃ ⊇ ∪ ∩ ∅ ∖ ∀ ∃ ∄ ∧ ∨ ¬ ∴ ∵ ℝ ℕ ℤ ℚ ℂ'.split(' '),
  'Прочее': '∞ ∂ ∇ ′ ″ ‴ … ⋯ ⋮ ⋱ ℏ ℓ ℵ △ ◻'.split(' ')
};
const FX_FN = 'sin cos tg ctg tan cot sec csc arcsin arccos arctg arcctg arctan sh ch th cth sinh cosh tanh ln lg log exp max min sup inf det dim ker deg gcd mod arg Re Im sgn'.split(' ');
const FX_FNSET = new Set(FX_FN);
const FX_OPS = new Set('+−-=<>≤≥≠≈±∓×÷·∗∘≡≅∼∝∈∉∋⊂⊆⊃⊇∪∩∖∧∨→←↔⇒⇐⇔↦⟶⟵⊕⊗≪≫⊥∥'.split(''));
const FX_BIG = {sum: '∑', prod: '∏', lim: 'lim', int: '∫', iint: '∬', iiint: '∭', oint: '∮'};
const FX_PAR = {'(': [')', 'M8 0.5Q1 10 8 19.5', 'M2 0.5Q9 10 2 19.5'], '[': [']', 'M8 0.7H2.2V19.3H8', 'M2 0.7H7.8V19.3H2'], '{': ['}', 'M8 0.5Q4 0.5 4 4V8Q4 10 1 10Q4 10 4 12V16Q4 19.5 8 19.5', 'M2 0.5Q6 0.5 6 4V8Q6 10 9 10Q6 10 6 12V16Q6 19.5 2 19.5']};

/* модель: «слот» — массив [строка, узел, строка, узел, …, строка]; у узла есть именованные слоты */
const fxNew = t => {
  const S = () => [''];
  switch(t){
    case 'frac': return {t: 'frac', n: S(), d: S()};
    case 'frac2': return {t: 'frac', n: S(), d: ['', {t: 'frac', n: S(), d: S()}, '']};
    case 'sqrt': return {t: 'sqrt', c: S()};
    case 'root': return {t: 'root', i: S(), c: S()};
    case 'abs': return {t: 'abs', c: S()};
    case 'sup': return {t: 'sup', c: S()};
    case 'sub': return {t: 'sub', c: S()};
    case 'par(': return {t: 'par', k: '(', c: S()};
    case 'par[': return {t: 'par', k: '[', c: S()};
    case 'par{': return {t: 'par', k: '{', c: S()};
    default:
      if(FX_BIG[t]) return t === 'lim' ? {t: 'big', k: 'lim', lo: S(), hi: S()} : (/int/.test(t) ? {t: 'int', k: t, hi: S(), lo: S()} : {t: 'big', k: t, hi: S(), lo: S()});
  }
  return null;
};
const FX_SLOTS = {frac: ['n', 'd'], sqrt: ['c'], root: ['i', 'c'], abs: ['c'], sup: ['c'], sub: ['c'], par: ['c'], big: ['hi', 'lo'], int: ['hi', 'lo']};
function fxFixSlot(s, depth, cnt){
  const out = [''];
  if(!Array.isArray(s) || depth > 9) return out;
  for(const it of s){
    if(typeof it === 'string'){ out[out.length - 1] += it.slice(0, 400); continue; }
    if(!it || typeof it !== 'object' || !FX_SLOTS[it.t] || ++cnt.n > 220) continue;
    const nd = {t: it.t};
    if(it.t === 'par') nd.k = FX_PAR[it.k] ? it.k : '(';
    if(it.t === 'big') nd.k = ['sum', 'prod', 'lim'].includes(it.k) ? it.k : 'sum';
    if(it.t === 'int') nd.k = ['int', 'iint', 'iiint', 'oint'].includes(it.k) ? it.k : 'int';
    FX_SLOTS[it.t].forEach(k => { nd[k] = fxFixSlot(it[k], depth + 1, cnt); });
    out.push(nd, '');
  }
  return out;
}
function fxParse(str){
  if(typeof str !== 'string' || str.length > 12000) return null;
  try{ const m = fxFixSlot(JSON.parse(str), 0, {n: 0}); return m; }catch(e){ return null; }
}
const fxIsEmpty = m => m.length === 1 && !m[0].trim();

/* --- отрисовка --- */
function fxStr(s){
  let h = '';
  const re = /[A-Za-z]+|[α-ωϑϕϰϱςϖ]|[^A-Za-zα-ωϑϕϰϱςϖ]/g; let m;
  while((m = re.exec(s))){
    const w = m[0];
    if(/^[A-Za-z]+$/.test(w)){
      if(FX_FNSET.has(w)) h += `<span class="mf">${w}</span>`;
      else {
        /* внутри слова ищем известные функции */
        let rest = w;
        while(rest){
          const fn = FX_FN.filter(f => rest.startsWith(f) && f.length > 1).sort((a, b) => b.length - a.length)[0];
          if(fn){ h += `<span class="mf">${fn}</span>`; rest = rest.slice(fn.length); }
          else { h += `<i>${rest[0]}</i>`; rest = rest.slice(1); }
        }
      }
    } else if(/^[α-ωϑϕϰϱςϖ]$/.test(w)) h += `<i>${w}</i>`;
    else if(w === '-') h += '<span class="mo">−</span>';
    else if(FX_OPS.has(w)) h += `<span class="mo">${esc(w)}</span>`;
    else if(w === ' ') h += '<span class="msp2"></span>';
    else if(w === ',' || w === ';') h += `${esc(w)}<span class="msp2"></span>`;
    else h += esc(w);
  }
  return h;
}
/* mode: 0 — просмотр, 1 — редактор, 2 — значок на кнопке */
function fxSlot(slot, path, mode){
  let h = '';
  for(let i = 0; i < slot.length; i++){
    if(i % 2 === 0){
      const s = slot[i];
      if(mode === 1){
        const solo = slot.length === 1, w = s.length ? Math.max(.6, s.length * .62 + .3) : (solo ? 1.3 : .45);
        h += `<input class="fxi${solo && !s ? ' solo' : ''}" data-p="${path}.${i}" value="${esc(s)}" style="width:${w}em" spellcheck="false" autocomplete="off" aria-label="Поле формулы">`;
      } else if(mode === 2){ h += s ? fxStr(s) : (slot.length === 1 ? '<i class="ph"></i>' : ''); }
      else h += fxStr(s);
    } else h += fxNode(slot[i], path + '.' + i, mode);
  }
  return h;
}
const fxBox = (cls, node, key, path, mode) => `<span class="${cls}${mode === 1 ? ' mslot' : ''}">${fxSlot(node[key], path + '.' + key, mode)}</span>`;
function fxNode(n, path, mode){
  const S = (k, cls) => fxBox(cls, n, k, path, mode), emptyV = k => mode === 0 && fxIsEmpty(n[k]);
  switch(n.t){
    case 'frac': return `<span class="mfr">${S('n', 'mn')}${S('d', 'md')}</span>`;
    case 'sqrt': return `<span class="msq"><svg class="mrd" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M.6 12.2L2.8 10l3.2 8.6L9.6 .8"/></svg>${S('c', 'mrc')}</span>`;
    case 'root': return `<span class="msq">${S('i', 'mri')}<svg class="mrd" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M.6 12.2L2.8 10l3.2 8.6L9.6 .8"/></svg>${S('c', 'mrc')}</span>`;
    case 'abs': return `<span class="mab">${S('c', 'mac')}</span>`;
    case 'par': { const p = FX_PAR[n.k]; return `<span class="mpa"><svg class="mpb" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="${p[1]}"/></svg>${S('c', 'mpc')}<svg class="mpb" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="${p[2]}"/></svg></span>`; }
    case 'sup': return S('c', 'msup');
    case 'sub': return S('c', 'msub');
    case 'big': {
      if(n.k === 'lim') return `<span class="mbg"><span class="mbs mlim">lim</span>${emptyV('lo') ? '' : S('lo', 'mbb')}</span>`;

async function openFormula(existing, cb){

    doneFn = done;
    const cv = m.querySelector('#fxCv'), palEl = m.querySelector('#fxPal');
    const inputs = () => Array.from(cv.querySelectorAll('input.fxi'));
    const focusPath = (p, pos) => { const el = cv.querySelector(`input[data-p="${p}"]`); if(el){ el.focus(); const v = pos == null ? el.value.length : pos; el.setSelectionRange(v, v); act = {el, path: p}; } return el; };
    const draw = (focus, pos) => { cv.innerHTML = fxSlot(model, 'r', 1); if(focus) focusPath(focus, pos); };
    const snap = () => { hist.push(JSON.stringify(model)); if(hist.length > 60) hist.shift(); };
    const setTab = k => { tab = k; palEl.innerHTML = pal[k]; m.querySelectorAll('[data-fxt]').forEach(b => { b.classList.toggle('on', b.dataset.fxt === k); b.setAttribute('aria-selected', b.dataset.fxt === k); }); };
    setTab(tab); draw('r.0'); setTimeout(() => focusPath('r.0'), 0);

    m.addEventListener('mousedown', e => { if(e.target.closest('.fxb')) e.preventDefault(); });

      el.style.width = (el.value.length ? Math.max(.6, el.value.length * .62 + .3) : (r.slot.length === 1 ? 1.3 : .45)) + 'em';

    const insertNode = id => {
      const node = fxNew(id); if(!node) return;
      if(!act || !cv.contains(act.el)){ const all = inputs(); if(!all.length) return; act = {el: all[all.length - 1], path: all[all.length - 1].dataset.p}; }
      const el = act.el, r = fxResolve(model, act.path), s = r.slot[r.idx], a = el.selectionStart == null ? s.length : el.selectionStart, b = el.selectionEnd == null ? a : el.selectionEnd;

    };
    const insertSym = sym => {
      if(!act || !cv.contains(act.el)){ const all = inputs(); if(!all.length) return; act = {el: all[all.length - 1], path: all[all.length - 1].dataset.p}; }
      const el = act.el, r = fxResolve(model, act.path), s = r.slot[r.idx], a = el.selectionStart == null ? s.length : el.selectionStart, b = el.selectionEnd == null ? a : el.selectionEnd;

}

/* картинка-иконка → квадрат 64×64 */
function bdIconFrom(file){
  return new Promise((res, rej) => {
    if(!/^image\/(png|jpe?g|webp|gif|bmp|avif)$/.test(file.type)) return rej(new Error('type'));
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
        const s = Math.min(im.naturalWidth, im.naturalHeight) || 1, sx = (im.naturalWidth - s) / 2, sy = (im.naturalHeight - s) / 2;
        x.drawImage(im, sx, sy, s, s, 0, 0, 64, 64);
        res(c.toDataURL('image/png'));
      };
      im.onerror = () => rej(new Error('img')); im.src = fr.result;
    };
    fr.onerror = () => rej(new Error('read')); fr.readAsDataURL(file);
  });
}

const DK_EASE = {linear: 'linear', in: 'cubic-bezier(.42,0,1,1)', out: 'cubic-bezier(0,0,.58,1)', inout: 'cubic-bezier(.42,0,.58,1)'};

function dkPt(S, e){ const r = S.ov.querySelector('#dksFit').getBoundingClientRect(); return [(e.clientX - r.left) / S.k, (e.clientY - r.top) / S.k]; }

}
function dkDrawEnd(S, e){

  S.down = false;
}
function dkDrawRender(S){
  const cv = S.ov && S.ov.querySelector('#dksCv'); if(!cv) return;

    const st = list[n]; let a = 1;
    if(st.fade){ const age = st.end ? now - st.end : 0; if(st.end){ a = age < 2200 ? 1 : Math.max(0, 1 - (age - 2200) / 800); if(a <= 0){ list.splice(n, 1); continue; } } }

  }

    S.trail = (S.trail || []).filter(p => now - p[2] < 650);
    if(S.trail.length > 1){ for(let i = 1; i < S.trail.length; i++){ const a = 1 - (now - S.trail[i][2]) / 650; ctx.strokeStyle = S.color; ctx.globalAlpha = Math.max(0, a) * .8; ctx.lineWidth = 7 * Math.max(.3, a); ctx.beginPath(); ctx.moveTo(S.trail[i - 1][0], S.trail[i - 1][1]); ctx.lineTo(S.trail[i][0], S.trail[i][1]); ctx.stroke(); } }

const dkB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
async function dkBackup(rec){
  const media = {};
  for(const s of rec.deck.slides) for(const o of s.objs){
    if(o.t === 'video' && o.fid && !media[o.fid]){ const b = await fsGet(o.fid); if(b) media[o.fid] = {name: o.name, type: o.type || b.type, b64: await dkB64(b)}; }
  }
  const out = {app: 'yng-text-deck', version: 1, exported: new Date().toISOString(), title: rec.title || 'Презентация', deck: rec.deck, media};
  const name = (rec.title || 'Презентация').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60) + '.yngdeck.json';
  const ok = await download(name, JSON.stringify(out), 'application/json');

}
async function dkRestore(file){
  let o; try{ o = JSON.parse(await file.text()); }catch(e){ toast('Не удалось прочитать файл'); return null; }
  if(!o || o.app !== 'yng-text-deck' || !o.deck){ toast('Это не резервная копия презентации'); return null; }
  const deck = dkFixDeck(o.deck); if(!deck){ toast('Файл повреждён'); return null; }
  const map = {};
  for(const fid of Object.keys(o.media || {})){
    const m = o.media[fid]; if(!m || typeof m.b64 !== 'string') continue;
    try{
      const bin = atob(m.b64), u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      const f = await fsPut(new File([u], String(m.name || 'video'), {type: String(m.type || 'video/mp4')})); map[fid] = f.id;
    }catch(e){}
  }
  deck.slides.forEach(s => s.objs.forEach(x => { if(x.t === 'video' && map[x.fid]) x.fid = map[x.fid]; }));
  const rec = {id: uid(), title: String(o.title || 'Презентация').slice(0, 160), html: dkSummaryHtml(deck), created: Date.now(), updated: Date.now(), pinned: false, hist: [], folder: dkFolder().id, date: null, tags: [], page: null, kind: 'deck', deck};

}

/* --- команды форматирования текста --- */
function dkTextCmd(c, arg){
  if(!dk.editing){
    const o = dkSelObjs()[0];
    if(!o || o.t !== 'text'){ toast('Выберите текстовый блок'); return; }
    dkStartEdit(o); document.execCommand('selectAll');
  }
  dk.editing.el.focus();
  switch(c){
    case 'bold': case 'italic': case 'underline': document.execCommand(c); break;
    case 'strike': document.execCommand('strikeThrough'); break;
    case 'mark': document.execCommand('hiliteColor', false, arg || '#ffd60a'); break;
    case 'h1': case 'h2': case 'h3': document.execCommand('formatBlock', false, c); break;
    case 'alignL': document.execCommand('justifyLeft'); break;
    case 'alignC': document.execCommand('justifyCenter'); break;
    case 'alignR': document.execCommand('justifyRight'); break;
    case 'alignJ': document.execCommand('justifyFull'); break;
    case 'ul': document.execCommand('insertUnorderedList'); break;
    case 'ol': document.execCommand('insertOrderedList'); break;
    case 'quote': document.execCommand('formatBlock', false, 'blockquote'); break;
    case 'codeb': document.execCommand('formatBlock', false, 'pre'); break;
    case 'clear': document.execCommand('removeFormat'); document.execCommand('formatBlock', false, 'p'); break;
    case 'link': { const u = normUrl(prompt('Адрес ссылки', 'https://') || ''); if(u) document.execCommand('createLink', false, u); break; }
    case 'color': document.execCommand('foreColor', false, arg); break;
  }
  const o = dkSlideObj().objs.find(x => x.id === dk.editing.id); if(o){ o.html = sanitize(dk.editing.el.innerHTML); dkDirty(); }
}

function dkApplyLayout(lay){

    const base = {x: Math.round(sl[1] * W), y: Math.round(sl[2] * H), w: Math.round(sl[3] * W), h: Math.round(sl[4] * H)};
    if(sl[0] === 'image'){

  changed();
}

  else while(el.firstChild){ if(!first) first = el.firstChild; frag.appendChild(el.firstChild); }

}

function tableOpBase(op){
  const cell = up(/^T[DH]$/); if(!cell) return;

  const mkCell = kind => { const d = document.createElement(kind); d.appendChild(document.createElement('br')); return d; };

/* images */
function readFile(f){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); }); }
async function compress(file){
  const src = await readFile(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const MAX = 1280, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, MAX / Math.max(w, h));
  if(k === 1 && file.size < 250000 && /^image\/(png|jpeg|webp|gif)$/.test(file.type)) return src;
  if(file.type === 'image/gif' && file.size < 1500000) return src;
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  let out = c.toDataURL('image/webp', .85);
  if(!out.startsWith('data:image/webp')) out = c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .85);
  return out;
}
async function insertImages(files){
  files = Array.from(files).filter(f => /^image\//.test(f.type));
  if(!files.length) return;
  let ok = 0;
  for(const f of files){
    try{ const uri = await compress(f); restore(); document.execCommand('insertHTML', false, '<img src="' + uri + '" alt="">'); ok++; }
    catch(e){ toast('Не удалось обработать изображение «' + (f.name || 'вставка') + '»'); }
  }
  if(ok){ ensureTail(ed); changed(); toast(ok === 1 ? 'Изображение добавлено' : 'Добавлено изображений: ' + ok); }
}

function popLink(anchor, existing){

      else { document.execCommand('createLink', false, url); ed.querySelectorAll('a').forEach(l => { l.setAttribute('target', '_blank'); l.setAttribute('rel', 'noopener noreferrer'); }); }

function run(c, b){
  switch(c){
    case 'bold': return ex('bold');

        p.addEventListener('click', e => { const k = e.target.closest('[data-k]'); if(!k) return; ex('hiliteColor', k.dataset.k); closePop(); });
      });
    case 'h1': case 'h2': case 'h3': return toggleBlock(c);
    case 'ul': return ex('insertUnorderedList');
    case 'ol': return ex('insertOrderedList');
    case 'indent': restore(); if(up(/^LI$/)) ex('indent'); else toast('Вложенность работает внутри списков'); return;
    case 'outdent': restore(); if(up(/^LI$/)) ex('outdent'); return;
    case 'quote': { restore(); const bq = up(/^BLOCKQUOTE$/); return bq ? unwrap(bq) : ex('formatBlock', 'blockquote'); }
    case 'code': return toggleCode();
    case 'hr': restore(); document.execCommand('insertHorizontalRule'); ensureTail(ed); changed(); return;
    case 'clear': return ex('removeFormat');
    case 'alignL': return alignBlocks('left');
    case 'alignC': return alignBlocks('center');
    case 'alignR': return alignBlocks('right');
    case 'alignJ': return alignBlocks('justify');
    case 'page': return popPage(b);
    case 'view': return popView(b);
    case 'table': {
      restore();
      return openPop(b, '<div class="tg-l" id="tgl">Выберите размер</div><div class="tg">' + Array.from({length: 36}, (_, i) => `<i data-r="${Math.floor(i / 6) + 1}" data-c="${i % 6 + 1}"></i>`).join('') + '</div>', p => {
        p.addEventListener('mouseover', e => { const i = e.target.closest('i'); if(!i) return; const r = +i.dataset.r, cc = +i.dataset.c; p.querySelectorAll('i').forEach(x => x.classList.toggle('on', +x.dataset.r <= r && +x.dataset.c <= cc)); p.querySelector('#tgl').textContent = r + ' × ' + cc; });
        p.addEventListener('click', e => { const i = e.target.closest('i'); if(!i) return; closePop(); insertTable(+i.dataset.r, +i.dataset.c); });
      });

    case 'attach': return attachToText();
    case 'fx': restore(); return openFormula();
    case 'chart': return addChartToText();
    case 'image': restore(); return fileImg.click();

    case 'undo': return ex('undo');
    case 'redo': return ex('redo');
    default: if(c === 'capt') return capTable(); if(/^(row|col|tbl)-/.test(c)) return tableOp(c);
  }
}

async function exportOne(rec, fmt){
  if(rec === cur) await flush();
  if(htmlEmpty(rec.html) && !rec.title){ toast('Черновик пуст — скачивать нечего'); return; }
  const n = slug(rec.title);
  let ok;
  if(fmt === 'md') ok = await download(n + '.md', mdOne(rec), 'text/markdown');
  else if(fmt === 'txt') ok = await download(n + '.txt', (rec.title ? rec.title + '\n\n' : '') + htmlToText(rec.html) + '\n', 'text/plain');
  else if(fmt === 'html') ok = await download(n + '.html', docHtml(rec), 'text/html');
  else ok = await download(n + '.json', JSON.stringify({app: 'yng-text', version: 1, exported: new Date().toISOString(), drafts: [recOut(rec)], folders: M.folders.filter(f => f.id === rec.folder), tasks: M.tasks.filter(t => t.files.includes(rec.id))}, null, 1), 'application/json');
  if(ok) toast('Файл «' + n + '.' + fmt + '» скачан');
}
async function exportAll(fmt){

function copyText(txt, okMsg){
  const ok = () => toast(okMsg);
  const fb = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('Не удалось скопировать'); } ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
}

function normBackup(o){
  const arr = Array.isArray(o) ? o : (o && (Array.isArray(o.drafts) ? o.drafts : Array.isArray(o.notes) ? o.notes : (o.notes && typeof o.notes === 'object') ? Object.values(o.notes) : []));
  return arr.filter(r => r && typeof r.html === 'string').map(r => {
    const html = sanitize(r.html);
    return {id: typeof r.id === 'string' && /^[\w-]{3,40}$/.test(r.id) ? r.id : uid(), title: typeof r.title === 'string' ? r.title.slice(0, 160) : '', html,
      created: +r.created || +r.updated || Date.now(), updated: +r.updated || Date.now(), pinned: !!r.pinned, hist: [],
      folder: typeof r.folder === 'string' && /^[\w-]{3,40}$/.test(r.folder) ? r.folder : null, date: /^\d{4}-\d\d-\d\d$/.test(r.date || '') ? r.date : null, tags: normTags(r.tags || []), page: ['a5', 'a4', 'a3'].includes(r.page) ? r.page : null};
  }).filter(r => !htmlEmpty(r.html) || r.title);
}
async function importFiles(files){
  files = Array.from(files || []); if(!files.length) return;
  await flush();
  const backups = [], docs = [], extras = []; let bad = 0;
  for(const f of files){
    const name = f.name || 'Без названия', ext = (name.match(/\.([^.]+)$/) || [,''])[1].toLowerCase(), base = name.replace(/\.[^.]+$/, '');
    try{
      const txt = await f.text();
      if(ext === 'json'){ const o = JSON.parse(txt); const l = normBackup(o); if(o && (Array.isArray(o.tasks) || Array.isArray(o.folders) || (o.board && Array.isArray(o.board.objs)))) extras.push(o); if(l.length) backups.push(...l); else if(!(o && ((o.tasks || []).length || (o.folders || []).length))) bad++; }
      else if(ext === 'md' || ext === 'markdown'){
        let t = txt.replace(/^\uFEFF/, ''), title = base; const m = t.match(/^\s*#\s+(.+?)\s*(?:\n|$)/);
        if(m){ title = m[1].replace(/[*_`]/g, ''); t = t.slice(m[0].length); }
        docs.push({title, html: sanitize(mdToHtml(t))});
      }
      else if(ext === 'html' || ext === 'htm'){
        const d = new DOMParser().parseFromString(txt, 'text/html');
        const title = ((d.querySelector('title') || {}).textContent || '').trim() || base;
        docs.push({title, html: sanitize(d.body ? d.body.innerHTML : txt)});
      }
      else docs.push({title: base, html: sanitize(textToHtml(txt.replace(/^\uFEFF/, '')))});
    }catch(e){ bad++; }
  }
  let added = 0, mode = 'merge';
  if(backups.length){
    const have = Object.keys(DR).length;
    if(have){
      const v = await modal({title: 'Загрузить резервную копию', text: `В файле черновиков: ${backups.length}. Сейчас в браузере: ${have}. «Объединить» оставит ваши файлы и добавит/обновит из резервной копии более новые; «Заменить всё» полностью заменит текущие.`, buttons: [{t:'Отмена', v:'no', cls:'neutral'}, {t:'Заменить всё', v:'replace', cls:'neutral'}, {t:'Объединить', v:'merge'}]});
      if(!v || v === 'no'){ if(!docs.length) return; backups.length = 0; }
      else mode = v;
    } else mode = 'replace';
  }
  if(backups.length){
    if(mode === 'replace') Object.keys(DR).forEach(k => delete DR[k]);
    backups.forEach(r => { const c = DR[r.id]; if(!c || r.updated >= c.updated){ DR[r.id] = r; } });
    added += backups.length;
  }
  docs.forEach(d => {
    if(htmlEmpty(d.html) && !d.title){ bad++; return; }
    const now = Date.now(); const r = {id: uid(), title: String(d.title || '').slice(0, 160), html: d.html, created: now, updated: now, pinned: false, hist: []};
    DR[r.id] = r; added++;
  });
  try{ await dbReplace(Object.values(DR)); }catch(e){ toast('Не удалось записать файлы в память браузера'); return; }
  extras.forEach(mergeExtra);
  cur = null; dirty = false; badge(); taskBadge();
  if(view === 'files') renderFiles(); else route();
  if(added || extraN) toast('Добавлено файлов: ' + added + (bad ? ' · не прочитано: ' + bad : ''));
  else toast('Не удалось прочитать файлы. Подойдут .json (резервная копия), .md, .txt и .html');
}
