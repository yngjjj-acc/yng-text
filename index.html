<style>
:root{
  --bg:#fff; --bg-alt:#f5f5f7; --bg-card:#f5f5f7; --bg-elev:#fff;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --accent:#0066cc; --accent-h:#0077ed; --accent-soft:rgba(0,102,204,.09);
  --nav-bg:rgba(255,255,255,.8); --nav-line:rgba(0,0,0,.16);
  --tip:#1d8a3f; --tip-bg:rgba(48,178,86,.10);
  --warn:#c2410c; --warn-bg:rgba(255,159,10,.14);
  --take:#5856d6; --take-bg:rgba(88,86,214,.09);
  --ex-bg:#f5f5f7; --ex-bar:#0066cc;
  --code-bg:#1d1d1f; --code-fg:#f5f5f7; --code-bar:#2c2c2e;
  --mark:rgba(255,204,0,.55);
  --sym-fill:rgba(0,102,204,.10);
  --shadow:0 8px 30px rgba(0,0,0,.08);
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --nav-h:44px;
  --ease:cubic-bezier(.28,.11,.32,1);
}
:root[data-theme="dark"]{
  --bg:#000; --bg-alt:#161617; --bg-card:#1d1d1f; --bg-elev:#1d1d1f;
  --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#86868b;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --accent:#2997ff; --accent-h:#4aa8ff; --accent-soft:rgba(41,151,255,.14);
  --nav-bg:rgba(22,22,23,.8); --nav-line:rgba(255,255,255,.15);
  --tip:#30d158; --tip-bg:rgba(48,209,88,.12);
  --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.14);
  --take:#8e8cff; --take-bg:rgba(125,122,255,.15);
  --ex-bg:#1d1d1f; --ex-bar:#2997ff;
  --code-bg:#0d0d0e; --code-fg:#f5f5f7; --code-bar:#232325;
  --mark:rgba(255,214,10,.4);
  --sym-fill:rgba(41,151,255,.16);
  --shadow:0 8px 30px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --bg-alt:#161617; --bg-card:#1d1d1f; --bg-elev:#1d1d1f;
    --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#86868b;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
    --accent:#2997ff; --accent-h:#4aa8ff; --accent-soft:rgba(41,151,255,.14);
    --nav-bg:rgba(22,22,23,.8); --nav-line:rgba(255,255,255,.15);
    --tip:#30d158; --tip-bg:rgba(48,209,88,.12);
    --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.14);
    --take:#8e8cff; --take-bg:rgba(125,122,255,.15);
    --ex-bg:#1d1d1f; --ex-bar:#2997ff;
    --code-bg:#0d0d0e; --code-fg:#f5f5f7; --code-bar:#232325;
    --mark:rgba(255,214,10,.4);
    --sym-fill:rgba(41,151,255,.16);
    --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .3s var(--ease),color .3s var(--ease)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;background:var(--nav-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--nav-line)}
.nav-in{max-width:1440px;height:100%;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;color:var(--text);letter-spacing:-.01em;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo-mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2997ff,#0066cc);display:grid;place-items:center}
.logo-mark svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.nav-links{display:flex;gap:4px;margin-left:8px}
.nav-links a{font-size:13px;color:var(--text-2);padding:6px 10px;border-radius:980px}
.nav-links a:hover{color:var(--text);text-decoration:none;background:var(--accent-soft)}
.nav-sp{flex:1}
.nav-search{position:relative;width:min(340px,38vw)}
.search-box{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:980px;background:rgba(120,120,128,.14);transition:background .2s,box-shadow .2s}
.search-box:focus-within{background:var(--bg-elev);box-shadow:0 0 0 2px var(--accent)}
.search-box svg{width:15px;height:15px;stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:13px;color:var(--text)}
.search-box input::placeholder{color:var(--text-3)}
.kbd{font-size:11px;color:var(--text-3);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;line-height:16px;flex:none}
.icon-btn{width:32px;height:32px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{background:var(--accent-soft);color:var(--text)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.only-mobile{display:none}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme-btn .sun{display:none}:root:not([data-theme="light"]) .theme-btn .moon{display:block}}

.eyebrow{font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:980px;padding:12px 22px;font-size:17px;background:var(--accent);color:#fff;transition:background .3s var(--ease),transform .2s}
.btn:hover{background:var(--accent-h);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{padding:8px 16px;font-size:14px}

.nb{font-size:15.5px;line-height:1.6;color:var(--text);word-wrap:break-word;overflow-wrap:anywhere}
.nb>*:first-child{margin-top:0}
.nb p,.nb ul,.nb ol,.nb blockquote,.nb pre,.nb table{margin:0 0 .7em}
.nb h1{font-size:1.65em;line-height:1.2;margin:.9em 0 .4em;letter-spacing:-.02em}
.nb h2{font-size:1.38em;line-height:1.25;margin:.9em 0 .4em;letter-spacing:-.015em}
.nb h3{font-size:1.15em;line-height:1.3;margin:.8em 0 .35em}
.nb ul,.nb ol{padding-left:1.5em}
.nb ul ul,.nb ol ol,.nb ul ol,.nb ol ul{margin:.2em 0 .2em}
.nb li{margin:.15em 0}
.nb blockquote{border-left:4px solid var(--accent);background:var(--accent-soft);padding:.6em 1em;border-radius:0 12px 12px 0;color:var(--text)}
.nb blockquote p:last-child{margin-bottom:0}
.nb pre{background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:12px;font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-x:auto}
.nb pre code{font:inherit;background:none;color:inherit;padding:0}
.nb a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.nb mark,.nb span[style*="background"]{color:inherit;border-radius:4px;padding:0 .12em}
.nb mark{background:rgba(255,214,10,.45)}
.nb img{max-width:100%;height:auto;border-radius:12px;display:block;margin:.5em 0;cursor:zoom-in}
.nb table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;font-size:.95em}
.nb td,.nb th{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top;min-width:40px;text-align:left}
.nb th{background:var(--bg-alt);font-weight:600}
.nb tr>*:last-child{border-right:0}
.nb tr:last-child>*{border-bottom:0}
.nb hr{border:0;border-top:1px solid var(--line-2);margin:1em 0}


.tb{min-width:30px;height:30px;padding:0 7px;border:0;border-radius:8px;background:transparent;color:var(--text);font-size:13.5px;display:grid;place-items:center;flex:none;white-space:nowrap}
.tb:hover{background:var(--accent-soft)}
.tb.on{background:var(--accent);color:#fff}
.tb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb b,.tb i,.tb u,.tb s{font-style:normal;font-weight:700;text-decoration:none;font-size:14px}
.tb i{font-style:italic;font-weight:600}.tb u{text-decoration:underline}.tb s{text-decoration:line-through}
.tb.txt{font-size:12.5px;padding:0 9px}
.tb .hl{width:15px;height:15px;border-radius:4px;background:rgba(255,214,10,.8);border:1px solid var(--line-2)}
.sep-v{width:1px;height:18px;background:var(--line-2);margin:0 4px;flex:none}

.zoom{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);z-index:300;display:none;place-items:center;padding:24px;cursor:zoom-out}
.zoom.on{display:grid}
.zoom img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}

.np-bubble{position:fixed;z-index:260;display:none;gap:1px;padding:4px;border-radius:12px;background:var(--code-bg);box-shadow:0 8px 28px rgba(0,0,0,.35);transform:translateX(-50%)}
.np-bubble.on{display:flex}
.np-bubble .tb{color:#f5f5f7;min-width:28px;height:28px}
.np-bubble .tb:hover{background:rgba(255,255,255,.16)}
.np-bubble .tb.on{background:#2997ff}
.np-bubble .sep-v{background:rgba(255,255,255,.22)}
.np-pop{position:fixed;z-index:270;min-width:190px;max-width:calc(100vw - 16px);background:var(--bg-elev);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.28);padding:8px}
.np-pop .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;font-size:13.5px;padding:8px 10px;border-radius:8px;color:var(--text)}
.np-pop .mi:hover{background:var(--accent-soft)}
.np-pop .mi.danger{color:#d70015}
.np-pop .mh{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);padding:6px 10px 2px}
.np-pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.np-pop label{display:block;font-size:12px;color:var(--text-2);margin:4px 2px 3px}
.np-pop input[type=text],.np-pop input[type=url]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);outline:0}
.np-pop input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.np-pop .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.sw{display:flex;gap:8px;padding:4px 6px}
.sw button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2)}
.sw button.no{background:var(--bg);position:relative}
.sw button.no::after{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:2px solid #d70015;transform:rotate(-45deg)}
.tg{display:grid;grid-template-columns:repeat(6,24px);gap:3px;padding:4px}
.tg i{width:24px;height:24px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg)}
.tg i.on{background:var(--accent);border-color:var(--accent)}
.tg-l{font-size:12.5px;color:var(--text-2);text-align:center;padding:2px 0 4px}
.np-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;z-index:400;background:var(--code-bg);color:#f5f5f7;font-size:14px;padding:11px 16px;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.35);display:flex;gap:14px;align-items:center;transition:all .3s var(--ease);max-width:calc(100vw - 24px)}
.np-toast.on{opacity:1;transform:translate(-50%,0)}
.np-toast button{border:0;background:transparent;color:#4aa8ff;font-size:14px;font-weight:600}
.np-modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.np-dlg{width:min(420px,100%);background:var(--bg-elev);border-radius:var(--r-md);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.np-dlg h3{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
.np-dlg p{margin:0 0 20px;color:var(--text-2);font-size:15px;line-height:1.5}
.np-dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.danger{background:#d70015}.btn.danger:hover{background:#ff3b30}
.btn.neutral{background:rgba(120,120,128,.18);color:var(--text)}.btn.neutral:hover{background:rgba(120,120,128,.28)}

/* ===== yng text: layout ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--stick:calc(var(--nav-h) + env(safe-area-inset-top,0px));--ed-font:var(--font);--ed-size:17px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.nav{height:calc(var(--nav-h) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
main{padding-top:var(--nav-h);min-height:100vh}
.nav-links{margin-left:10px}
.nav-links a{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 12px}
.nav-links a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-links a.act{color:var(--text);background:var(--accent-soft)}
.bdg{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:600}
.bdg:empty{display:none}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border:0;border-radius:980px;font-size:13px;color:var(--text);background:rgba(120,120,128,.14);white-space:nowrap}
.pill:hover{text-decoration:none;background:var(--accent-soft)}
.pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.logo-mark svg{width:13px;height:13px;stroke-width:2.4}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.page{max-width:980px;margin:0 auto;padding:34px 24px 80px}
body.wide .page{max-width:1240px}
.page[hidden]{display:none}
@media (max-width:760px){
  .nav-in{padding:0 12px;gap:8px}
  .pill .lbl{display:none}.pill{padding:0 9px}
  .nav-links{margin-left:2px}
  .nav-links a{padding:6px 9px}
  .page{padding:22px 14px 70px}
}
@media (max-width:420px){.logo-t{display:none}}

/* ===== editor page ===== */
.ed-top{display:flex;align-items:flex-start;gap:12px}
.ed-title{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:clamp(30px,4.6vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.12;color:var(--text);padding:0}
.ed-title::placeholder{color:var(--text-3)}
.ed-acts{display:flex;gap:2px;flex:none;align-items:center;margin-top:4px}
.ed-acts .icon-btn{width:36px;height:36px;background:rgba(120,120,128,.12)}
.ed-acts .icon-btn:hover{background:var(--accent-soft)}
.ed-acts .icon-btn.on{background:var(--accent);color:#fff}
.ed-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;color:var(--text-3);font-size:13px;margin:10px 0 18px;font-variant-numeric:tabular-nums}
.ed-meta .st.ok::before{content:"✓ ";color:var(--tip)}
.ed-meta .st.err{color:#d70015}
.ed-card{background:var(--bg-elev);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow)}
.ed-bar{position:sticky;top:var(--stick);z-index:30;display:flex;flex-direction:column;gap:4px;padding:6px 8px;background:var(--nav-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);border-radius:var(--r-md) var(--r-md) 0 0}
.np-row{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.np-row.tbl{border-top:1px dashed var(--line-2);padding-top:4px}
.np-row[hidden]{display:none}
.ed-area{padding:26px 34px 60px;min-height:58vh;cursor:text}
.ed{outline:none;min-height:50vh;position:relative}
.ed.nb{font-family:var(--ed-font);font-size:var(--ed-size);line-height:1.65}
.ed.is-empty::before{content:attr(data-ph);position:absolute;left:0;top:0;color:var(--text-3);pointer-events:none}
.ed td,.ed th{position:relative}
.ed pre,.nb pre{font-family:var(--mono)}
@media (max-width:760px){
  .ed-area{padding:18px 16px 50px}
  .ed-bar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ed-bar .np-row{flex-wrap:nowrap}
  .ed-bar::-webkit-scrollbar{display:none}
  .ed-acts .icon-btn{width:32px;height:32px}
}
.zen-exit{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:260;display:none}
body.zen .zen-exit{display:inline-flex}
body.zen .nav,body.zen footer{display:none}
body.zen main{padding-top:0}
body.zen .page{max-width:820px;padding-top:calc(30px + env(safe-area-inset-top,0px))}
body.zen .ed-acts,body.zen .hide-zen{display:none}
body.zen .ed-card{border:0;box-shadow:none;background:transparent}
body.zen .ed-bar{top:0;opacity:.3;transition:opacity .25s;background:transparent;border-bottom:0}
body.zen .ed-bar:hover,body.zen .ed-bar:focus-within{opacity:1;background:var(--nav-bg)}
body.zen{overflow-x:hidden}

/* view popover (Aa) */
.seg{display:flex;gap:4px;padding:2px 2px 6px}
.seg button{flex:1;border:0;background:rgba(120,120,128,.14);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--text)}
.seg button.on{background:var(--accent);color:#fff}
.seg button:hover:not(.on){background:var(--accent-soft)}
.np-pop .sz{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
.np-pop .sz b{flex:1;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.np-pop .sz button{width:34px;height:30px;border:0;border-radius:9px;background:rgba(120,120,128,.14);font-size:15px;color:var(--text)}
.np-pop .sz button:hover{background:var(--accent-soft)}
.np-pop .mi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--text-2)}
.np-pop .mi.danger svg{color:#d70015}
.np-pop .mi .k{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.np-pop .mi.cur{background:var(--accent-soft)}
.np-pop .mi.col{flex-direction:column;align-items:flex-start;gap:0}
.np-pop .mi.col small{font-size:11.5px;color:var(--text-3)}
.np-pop a.mi{text-decoration:none}
.np-pop .list{max-height:300px;overflow-y:auto;min-width:240px}

/* ===== files page ===== */
.fl-h1{font-size:clamp(34px,5vw,52px);letter-spacing:-.03em;line-height:1.08;margin:0 0 10px}
.lead{color:var(--text-2);font-size:19px;margin:0 0 24px;max-width:36em}
.np-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.np-bar .search-box{flex:1;min-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;align-items:center}
.chip{padding:6px 14px;border:0;border-radius:980px;background:rgba(120,120,128,.12);font-size:14px;color:var(--text)}
.chip:hover{background:var(--accent-soft)}
.chip.on{background:var(--accent);color:#fff}
.chips .sp{flex:1}
.np-card{background:var(--bg-card);border-radius:var(--r-md);margin-bottom:12px;overflow:hidden}
.np-card>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}
.np-card>summary::-webkit-details-marker{display:none}
.fico{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.fico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.np-card .nt{flex:1;min-width:0}
.np-card .nt b{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-card .nt small{display:block;font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.np-card .nm{font-size:12.5px;color:var(--text-3);white-space:nowrap;text-align:right}
.np-card .chev{width:8px;height:8px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(45deg);transition:transform .25s;flex:none;margin:0 4px}
.np-card[open] .chev{transform:rotate(-135deg)}
.pin{width:30px;height:30px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--text-3);flex:none}
.pin:hover{background:var(--accent-soft);color:var(--text)}
.pin svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.pin.on{color:#ff9f0a}.pin.on svg{fill:#ff9f0a}
.np-card .cb{padding:2px 18px 18px}
.np-card .cb .nb{max-height:420px;overflow:auto;background:var(--bg);border-radius:14px;padding:14px 18px}
.np-card .cb .nb.exp{max-height:none}
.np-card .ca{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.np-empty{text-align:center;padding:60px 20px;color:var(--text-2);border:1px dashed var(--line-2);border-radius:var(--r-md)}
.np-empty b{display:block;font-size:20px;color:var(--text);margin-bottom:6px}
.np-empty .btn{margin-top:16px}
.np-mod{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:26px 0 10px;font-weight:600}
@media (max-width:760px){
  .np-card .nm{display:none}
  .np-card>summary{padding:12px 12px}
}
.drop{position:fixed;inset:10px;z-index:450;display:none;place-items:center;background:var(--accent-soft);border:3px dashed var(--accent);border-radius:var(--r-lg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--accent);font-size:22px;font-weight:600;pointer-events:none}
.drop.on{display:grid}

/* template + history dialogs */
.np-dlg.wide{width:min(560px,100%)}
.np-dlg.xl{width:min(760px,100%)}
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 6px}
.tpl{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:var(--bg-alt);border-radius:var(--r-sm);padding:14px 16px;color:var(--text)}
.tpl:hover{background:var(--accent-soft)}
.tpl .fico{width:34px;height:34px;border-radius:10px}
.tpl b{display:block;font-size:15px;letter-spacing:-.01em}
.tpl small{display:block;color:var(--text-2);font-size:13px;line-height:1.35;margin-top:1px}
.hist{display:grid;grid-template-columns:210px 1fr;gap:12px;height:min(56vh,380px);margin-bottom:16px}
.hist-l{overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.hist-l button{border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:10px;font-size:13.5px;color:var(--text)}
.hist-l button small{display:block;color:var(--text-3);font-size:12px}
.hist-l button:hover{background:var(--accent-soft)}
.hist-l button.on{background:var(--accent);color:#fff}
.hist-l button.on small{color:rgba(255,255,255,.8)}
.hist-p{overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
@media (max-width:620px){.tpl-grid{grid-template-columns:1fr}.hist{grid-template-columns:1fr;grid-template-rows:120px 1fr;height:min(66vh,460px)}}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0 0 18px;font-size:14.5px}
.keys kbd{font-family:var(--mono);font-size:12.5px;background:rgba(120,120,128,.14);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;white-space:nowrap;justify-self:start}
.keys span{color:var(--text-2)}
.np-dlg h3{margin:0 0 8px}
.np-dlg .sub{margin:0 0 16px}

/* footer */
footer{background:var(--bg-alt);color:var(--text-3);font-size:12px;line-height:1.5;padding:26px 0 30px}
footer .wrap{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
footer a{color:var(--text-2)}

@media print{
  .nav,.ed-acts,.ed-bar,.ed-meta,footer,.np-toast,.np-bubble,.zen-exit{display:none!important}
  :root{padding:0}main{padding:0!important;min-height:0}
  .page{padding:0;max-width:none}
  body{background:#fff!important;color:#000}
  .ed-card{border:0;box-shadow:none;background:transparent}
  .ed-area{padding:0;min-height:0}.ed-title,.nb{color:#000!important}
  .nb pre{background:#f5f5f7;color:#1d1d1f}
}


/* ===== v2: навигация и общие элементы ===== */
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
.nav-links{margin-left:6px}
.nav-links a{padding:6px 11px}
.nav-links a .bdg{margin-left:1px}
@media (max-width:1040px){.nav-links a .lb{display:none}.nav-links a{padding:7px 10px}}
.pill.act{background:var(--accent);color:#fff}
.page.pdash{max-width:1120px}

/* ===== формы ===== */

.tf input[type=text],.tf input[type=date],.tf input[type=datetime-local],.tf input[type=search],.tf textarea,.gs{width:100%;font:inherit;font-size:15px;padding:9px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);outline:0}

.tf input:focus,.tf textarea:focus,.gs:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

.seg{flex-wrap:wrap}

.fchip{display:flex;align-items:center;gap:6px;background:var(--bg-alt);border-radius:10px;padding:4px 4px 4px 12px;margin-bottom:6px;font-size:14px}

.pk{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:6px;background:var(--bg)}
.pkb{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--text)}
.pkb:hover{background:var(--accent-soft)}
.pkb.on{background:var(--accent);color:#fff}
.tg-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tg-sug button{border:0;border-radius:980px;padding:3px 10px;font-size:12.5px;background:rgba(120,120,128,.14);color:var(--text)}

.hint{font-size:12.5px;color:var(--text-3);margin:6px 2px 0}
.gs-r{max-height:52vh;overflow-y:auto;margin:12px 0 14px}

.tri:last-child{border-bottom:0}
.tri .nt{flex:1;min-width:0}.tri .nt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tri .nt small{color:var(--text-3);font-size:12.5px}
.trl{max-height:46vh;overflow-y:auto;margin-bottom:14px}

/* ===== задача внутри текста ===== */
.nb p.tk{position:relative;background:var(--bg-card);border-left:4px solid var(--text-3);border-radius:14px;padding:10px 14px 10px 44px;margin:0 0 .6em;cursor:pointer;user-select:none;-webkit-user-select:none}
.nb p.tk::before{content:"";position:absolute;left:13px;top:50%;width:19px;height:19px;margin-top:-9.5px;border:2px solid var(--text-3);border-radius:6px;box-sizing:border-box;color:#fff;font-size:12px;line-height:15px;text-align:center}
.nb p.tk:hover::before{border-color:var(--accent)}
.nb p.tk.done::before{content:"✓";background:var(--accent);border-color:var(--accent)}
.nb p.tk::after{content:attr(data-meta);display:inline-block;margin-left:10px;font-size:.78em;color:var(--text-3)}
.nb p.tk.done{opacity:.65;text-decoration:line-through}
.nb p.tk.over{color:#d70015}.nb p.tk.hot{color:var(--warn)}
.nb p.tk.pr-crit{border-left-color:#ff3b30}.nb p.tk.pr-high{border-left-color:#ff9f0a}.nb p.tk.pr-mid{border-left-color:#0a84ff}.nb p.tk.pr-low{border-left-color:#8e8e93}

/* ===== главный экран ===== */
.hero{position:relative;text-align:center;padding:30px 0 46px;isolation:isolate}
.blob{position:absolute;left:50%;top:66%;width:min(640px,94%);height:210px;transform:translate(-50%,-50%);border-radius:50%;filter:blur(80px);-webkit-filter:blur(80px);opacity:.6;z-index:-1;transition:background .9s var(--ease)}

.h-date{font-size:14px;color:var(--text-2)}
.h-time{font-size:clamp(26px,4vw,36px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 16px}
.h-greet{margin:0;font-size:clamp(38px,7.4vw,78px);line-height:1.05;letter-spacing:-.035em;display:inline-flex;align-items:center;justify-content:center;gap:.26em;flex-wrap:wrap}
.h-greet .gi svg{width:.78em;height:.78em;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wd{background:var(--bg-card);border-radius:var(--r-lg);padding:22px 22px 18px;min-width:0}
.wd.wide{grid-column:1/-1}
@media (max-width:820px){.dgrid{grid-template-columns:1fr}.wd{padding:18px 14px 14px}}
.wd-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.wd-h h2{margin:0;font-size:21px;letter-spacing:-.02em}
.wd-h .cnt{margin-left:auto;font-size:13px;color:var(--text-3)}
.wd-h small{color:var(--text-3);font-size:13px}
.qa{display:flex;gap:8px;margin:0 0 10px}
.qa input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 16px;border-radius:980px;border:0;background:var(--bg);color:var(--text);outline:0;box-shadow:inset 0 0 0 1px var(--line-2)}
.qa input:focus{box-shadow:0 0 0 2px var(--accent)}
.trows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.trow{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px}
.trow:hover{background:var(--accent-soft)}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--text-3);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.ck:hover{border-color:var(--accent)}
.ck.on{background:var(--accent);border-color:var(--accent)}

.trow .tx{flex:1;min-width:0;cursor:pointer}
.trow .tx b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tx small{display:block;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.done .tx b{text-decoration:line-through;color:var(--text-3)}
.trow.over .tx b{color:#d70015}
.trow.hot .tx b{color:var(--warn)}
.trow.over .tx small{color:#d70015}
.pd{width:8px;height:8px;border-radius:50%;flex:none}
.hotm{width:5px;align-self:stretch;border-radius:3px;flex:none;min-height:30px}
.wd-s{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;margin:16px 0 6px}

.wd-e{color:var(--text-3);font-size:14.5px;padding:8px 4px}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}

.hub-row{display:flex;align-items:center;min-width:0}
.hub-i{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:8px 6px;border-radius:12px;color:var(--text)}
.hub-i:hover{background:var(--accent-soft)}
.hub-i .nt{flex:1;min-width:0}
.hub-i .nt b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-i .nt small{display:block;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-i .nm{font-size:12px;color:var(--text-3);white-space:nowrap}
@media (max-width:520px){.hub-i .nm{display:none}}

/* ===== задачи ===== */
.grp{display:flex;align-items:center;gap:12px;margin:22px 0 6px;font-size:13px;font-weight:600;color:var(--text-2)}

.kc{background:var(--bg-elev);border:1px solid var(--line);border-left:4px solid var(--c,#8e8e93);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:grab}

.cal-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}

.cd{min-height:80px;background:var(--bg-card);border:0;border-radius:14px;padding:7px 8px 6px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px;align-items:flex-start}

.cd:hover{background:var(--accent-soft)}

.cd.s{box-shadow:inset 0 0 0 2px var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

.dots i.fm{border-radius:2px;background:var(--take)}
.dots i.dn{opacity:.35}
.dots em{font-style:normal;font-size:11px;color:var(--text-3)}
@media (max-width:620px){.cd{min-height:56px;padding:4px}.cd b{min-width:22px;height:22px;font-size:12.5px}.cal-h h2{font-size:21px}}

.cwc{background:var(--bg-card);border-radius:var(--r-md);padding:10px;min-height:200px}
.cwc.t{box-shadow:inset 0 0 0 2px var(--accent)}
.cwc.s{background:var(--accent-soft)}
.cwh{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:8px;border:0;background:transparent;width:100%;padding:0}

.cwi{font-size:13px;border-radius:9px;padding:6px 8px;margin-bottom:5px;background:var(--bg-elev);border-left:3px solid var(--c,#8e8e93);cursor:pointer;overflow-wrap:anywhere}
.cwi.f{border-left-color:var(--take);background:var(--take-bg)}
.cwi.done{opacity:.55;text-decoration:line-through}
.cwi.over{color:#d70015}
.load{height:4px;border-radius:2px;background:var(--line-2);margin:0 0 8px;overflow:hidden}
.load i{display:block;height:100%;background:var(--accent);border-radius:2px}
.wk-sum{color:var(--text-2);font-size:14.5px;margin:0 0 12px}
.cdy{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){.cdy{grid-template-columns:1fr}}
.tml{height:560px;overflow-y:auto;background:var(--bg-card);border-radius:var(--r-md);padding:4px 12px}
.hr{display:flex;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.hr:first-child{border-top:0}

.hc{flex:1;padding:4px 0;cursor:pointer;min-width:0}
.hc:hover{background:var(--accent-soft);border-radius:8px}
.hr.now>span{color:var(--accent);font-weight:600}
.dp{background:var(--bg-card);border-radius:var(--r-md);padding:18px}

/* ===== папки и корзина ===== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:0 0 22px}
.ftile{display:flex;align-items:center;gap:12px;border:0;border-radius:var(--r-sm);padding:12px;background:var(--bg-card);color:var(--text);text-align:left;position:relative;min-width:0;cursor:pointer;width:100%}
.ftile:hover{background:var(--accent-soft)}
.ftile.on{box-shadow:inset 0 0 0 2px var(--accent)}
.ftile.over{box-shadow:inset 0 0 0 2px var(--tip);background:var(--tip-bg)}
.ftile.add{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-2)}
.ftile.add:hover{background:var(--accent-soft);color:var(--text)}
.fic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.fic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ftile .ft{flex:1;min-width:0}
.ftile b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fedit{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--text-3);display:grid;place-items:center;opacity:0;transition:opacity .2s}

.fedit:hover{background:rgba(120,120,128,.2);color:var(--text)}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 16px}
.crumb .fic{width:34px;height:34px;border-radius:10px}
.crumb h2{margin:0;font-size:22px;letter-spacing:-.02em}
.crumb .sp{flex:1}
.fbd{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:980px;padding:2px 9px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}

/* page popover */

.np-pop .mi.pg .pgi svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;display:block}

/* page borders in editor */
.ed-area{position:relative}
.pg-lines{position:absolute;inset:0;pointer-events:none;z-index:2}
.pg-ln{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);opacity:.55;height:0}

.ed-card[data-pg]:not([data-pg=""]){box-shadow:var(--shadow)}
/* images */
.nb img{display:inline-block;vertical-align:bottom;max-width:100%;height:auto;margin:.3em 0;cursor:pointer}
.nb img[data-al=c]{display:block;margin:.6em auto;clear:both}
.nb img[data-al=l]{float:left;margin:.3em 1.1em .6em 0}
.nb img[data-al=r]{float:right;margin:.3em 0 .6em 1.1em}
.nb::after{content:"";display:table;clear:both}
.nb [style*="justify"]{hyphens:auto;-webkit-hyphens:auto}
.img-ui{position:fixed;z-index:250;border:2px solid var(--accent);border-radius:4px;pointer-events:none}
.img-ui[hidden]{display:none}
.img-ui .hd{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent);pointer-events:auto;touch-action:none}
.img-bar{position:absolute;left:50%;top:-46px;transform:translateX(-50%);display:flex;gap:1px;padding:4px;border-radius:12px;background:var(--code-bg);box-shadow:0 8px 28px rgba(0,0,0,.35);pointer-events:auto}
.img-bar.below{top:auto;bottom:-46px}

.img-bar button.on{background:#2997ff}
.img-bar svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.img-bar .sep-v{background:rgba(255,255,255,.22)}
/* trashed inline tasks */
.nb p.tk.trashed{opacity:.4;text-decoration:line-through}
@media print{
  .img-ui,.pg-lines,.trash-fab{display:none!important}
  .ed-card,.ed-card[data-pg]{max-width:none!important;margin:0!important;box-shadow:none!important}
  .ed-area{padding:0!important;min-height:0!important;max-width:none!important}
  .page,#vEd{max-width:none!important;padding:0!important}
  .nb p,.nb li{orphans:3;widows:3}
  .nb h1,.nb h2,.nb h3{break-after:avoid;page-break-after:avoid}
  .nb table,.nb tr,.nb img,.nb pre,.nb blockquote,.nb p.tk{break-inside:avoid;page-break-inside:avoid}
  .nb table{width:100%}
  .nb img{max-width:100%!important}
  .nb [style*="justify"]{hyphens:auto}
}

.bd-pn{display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--accent);font-size:13px;font-weight:600;flex:none}
.bd-pn svg{width:16px;height:16px}.bd-pn:hover{background:var(--accent-soft)}
.bd-ptr{position:relative}.bd-ptr .bdg{position:absolute;top:1px;right:1px;min-width:15px;height:15px;font-size:10px;line-height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;text-align:center}
.bd-ptr .bdg:empty{display:none}
.bd-tp{width:min(360px,calc(100vw - 32px))}
.bd-tr{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.bd-tr:last-of-type{border-bottom:0}
@media (max-width:1000px){.bd-pages{top:60px;left:8px;right:8px;transform:none;max-width:none}}
@media (max-width:640px){.bd-top.bd-r{top:58px}.bd-pages{top:104px}.board-view.side-open .bd-top.bd-r{right:8px}}
/* ===== emoji ===== */
.em,.emp,.emg .emb,.emfield{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif}
.em-i{display:inline-block;width:1em;height:1em;background-repeat:no-repeat;vertical-align:-.15em}
.emp{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;padding:4px;box-sizing:border-box;border-radius:9px;background:#F4F9FF;font-size:17px;line-height:1;vertical-align:middle;color:#000;font-style:normal}
.emp.s{width:20px;height:20px;padding:2px;border-radius:6px;font-size:12px}
.kc b .emp,.cwi .emp{vertical-align:-4px;margin-right:6px}
.bd-task .emp{margin-top:-1px}
.tf-em{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.emfield{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-elev);color:var(--text);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.emfield:hover{border-color:var(--accent)}
.emfield .emp{width:36px;height:36px;font-size:21px}
.emfield small{color:var(--text-2);font-size:12px;margin-left:auto}
.emp-ov{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.emp-box{width:min(420px,100%);max-height:min(560px,90vh);display:flex;flex-direction:column;background:var(--bg-elev);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.emp-top{padding:12px 12px 6px}
.emp-top input{width:100%;box-sizing:border-box}
.emp-tabs{display:flex;gap:2px;padding:0 8px 6px;overflow-x:auto;border-bottom:1px solid var(--line-2)}
.emp-tabs button{flex:none;border:0;background:none;font-size:18px;padding:4px 7px;border-radius:8px;cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;opacity:.6}
.emp-tabs button.on,.emp-tabs button:hover{background:var(--hover,rgba(0,0,0,.06));opacity:1}
.emp-body{flex:1;overflow-y:auto;padding:4px 12px 10px;min-height:200px}
.emp-body h4{margin:10px 0 4px;font-size:12px;color:var(--text-2);font-weight:600}
.emg{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:2px}
.emb{border:0;background:none;font-size:24px;line-height:1;padding:6px 0;border-radius:8px;cursor:pointer}
.emb:hover,.emb:focus-visible{background:#F4F9FF;outline:none}
.emp-none{padding:30px 0;text-align:center;color:var(--text-2);font-size:13px}
.emp-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line-2)}
/* ===== v6: подзадачи, вложения ===== */
.sbl{list-style:none;margin:0;padding:0 0 0 12px;position:relative}
.sbl li{position:relative;display:flex;align-items:flex-start;gap:9px;padding:3px 0 3px 18px;font-size:14px;line-height:1.4;text-align:left}
.sbl li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line-2)}
.sbl li:last-child::before{bottom:auto;height:14px}
.sbl li::after{content:"";position:absolute;left:0;top:13px;width:12px;border-top:1.5px solid var(--line-2)}
.sbl li.d>span{text-decoration:line-through;color:var(--text-3)}
.sbl li>span{min-width:0;overflow-wrap:anywhere}
.sck{flex:none;width:18px;height:18px;margin-top:1px;border:1.8px solid var(--text-3);border-radius:6px;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:#fff}
.sck svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.sck.on{background:var(--accent);border-color:var(--accent)}.sck.on svg{opacity:1}
.sck:hover{border-color:var(--accent)}
.atl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.atc{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:5px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-elev);color:var(--text);font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.atc:hover{border-color:var(--accent);background:var(--accent-soft)}
.atc svg{flex:none;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.atc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atc small{color:var(--text-3);font-size:11.5px;flex:none}
.trow{flex-wrap:wrap}
.tex{flex:none;display:inline-flex;align-items:center;gap:2px;border:0;background:transparent;color:var(--text-2);font:inherit;font-size:12.5px;padding:3px 6px;border-radius:8px;cursor:pointer}
.tex:hover{background:var(--accent-soft)}
.tex svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.tex.on svg{transform:rotate(180deg)}
.trx{flex:1 0 100%;padding:2px 8px 6px 50px;box-sizing:border-box}
.cwi .sbl,.cwi .atl{text-decoration:none;color:var(--text);margin-top:4px}
.cwi .sbl li{font-size:12px;padding:2px 0 2px 16px}.cwi .sbl li::after{top:11px;width:10px}
.cwi .sck{width:15px;height:15px;border-radius:5px}.cwi .sck svg{width:10px;height:10px}
.cwi .atc{font-size:11.5px;padding:3px 8px}
/* инлайн-задача */
.nb p.tk{padding:10px 14px 10px 44px}
.nb p.tk::after{content:none!important}
.nb p.tk .tkr{display:flex;align-items:center;gap:9px}
.nb p.tk .tkt::after{content:attr(data-meta);display:inline-block;margin-left:10px;font-size:.78em;color:var(--text-3);text-decoration:none}
.nb p.tk.ext::before{top:19px;margin-top:0}
.nb p.tk .sbl,.nb p.tk .atl{margin-top:8px;text-decoration:none;user-select:none;cursor:default}
.nb p.tk .sbl{padding-left:8px}
.nb p.tk .sbl li{font-size:.92em}
.nb p.tk.done .sbl li:not(.d)>span{text-decoration:none}
.nb p.tk .emp.s{margin:0;font-size:12px}
/* ===== v6b: таблицы ===== */
.nb table{table-layout:fixed}
.nb td,.nb th{min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
.nb tr[style*="height"]>td,.nb tr[style*="height"]>th{height:inherit}
.tbl-guide{position:fixed;z-index:60;background:var(--accent);opacity:.75;border-radius:2px;pointer-events:none}
body.tbl-resizing,body.tbl-resizing *{user-select:none!important;-webkit-user-select:none!important}
/* подписи */
.nb p.cap{font-size:calc(1em - 2.5px);line-height:1.4;color:var(--text-3);margin:.15em 0 .8em;text-align:left}
.nb p.cap[data-cap="t"]{margin:.8em 0 .3em;text-align:left!important}
.nb p.cap:has(> br:only-child)::before{content:"Подпись…";color:var(--text-3);opacity:.55;pointer-events:none}
.nb p.cap[data-cap="i"]:has(> br:only-child)::before{content:"Подпись к изображению…"}
.nb p.cap[data-cap="t"]:has(> br:only-child)::before{content:"Подпись к таблице…"}
.img-bar [hidden]{display:none}
/* файл в тексте */
.nb p.fw{display:flex;align-items:center;gap:12px;margin:.3em 0 .7em;padding:10px 12px;border:1px solid var(--line-2);border-radius:14px;background:var(--bg-card);user-select:none;position:relative}
.nb p.fw .fw-i{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.02em;overflow:hidden}
.nb p.fw .fw-t{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.3}
.nb p.fw .fw-t b{font-weight:600;font-size:.95em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb p.fw .fw-t small{color:var(--text-3);font-size:.8em}
.nb p.fw .fw-b{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg-elev);color:var(--accent);border-radius:10px;padding:6px 11px;font:inherit;font-size:.85em;cursor:pointer}
.nb p.fw .fw-b:hover{background:var(--accent-soft)}
.nb p.fw .fw-b svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb p.fw .fw-x{flex:none;width:24px;height:24px;border:0;background:transparent;color:var(--text-3);border-radius:8px;display:grid;place-items:center;cursor:pointer;opacity:0}
.nb p.fw:hover .fw-x{opacity:1}.nb p.fw .fw-x:hover{background:var(--bg-alt)}
.nb p.fw .fw-x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
/* формулы */
.nb p.fx{display:block;text-align:center!important;margin:.5em 0 .8em;padding:.3em 0;cursor:pointer;border-radius:10px;user-select:none;overflow-x:auto;overflow-y:hidden;font-size:1.22em;line-height:1.2}
.nb p.fx:hover{background:var(--accent-soft)}
.fxr,.fxcv{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",Times,serif;font-size:1em;color:var(--text);white-space:nowrap}
.fxr i,.fxcv i{font-style:italic}
.fxr .mf{font-style:normal;margin-right:.08em}
.fxr .mo{padding:0 .2em}
.fxr .msp2{display:inline-block;width:.25em}
.mfr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.15}
.mfr>.mn{padding:0 .2em .1em;border-bottom:1.4px solid currentColor;min-width:.6em}
.mfr>.md{padding:.1em .2em 0;min-width:.6em}
.msq{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .1em}
.msq .mrd{width:.8em;flex:none;overflow:visible}
.msq .mrd path,.mpa .mpb path{fill:none;stroke:currentColor;stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.msq .mrc{border-top:1.4px solid currentColor;padding:.12em .15em 0 .1em;align-self:stretch;display:inline-flex;align-items:center}
.msq .mri{font-size:.62em;align-self:flex-start;margin:.1em -.55em 0 .1em;position:relative;z-index:1}
.mab{display:inline-block;vertical-align:middle;border-left:1.4px solid currentColor;border-right:1.4px solid currentColor;padding:0 .25em;margin:0 .1em}
.mpa{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .05em}
.mpa .mpb{width:.42em;flex:none;overflow:visible;min-height:1.2em}
.mpa .mpc{display:inline-flex;align-items:center;padding:0 .1em}
.msup,.msub{font-size:.7em;line-height:0;display:inline-block}
.msup{vertical-align:.8em;margin-left:.04em}.msub{vertical-align:-.45em;margin-left:.04em}
.mbg{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.1}
.mbg .mbs{font-size:1.6em;line-height:1}
.mbg .mbs.mlim{font-size:1em;font-style:normal;margin-bottom:.05em}
.mbg .mbt,.mbg .mbb{font-size:.7em;line-height:1.1;white-space:nowrap;display:inline-flex;align-items:center}
.mit{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .15em}
.mit .mis{font-size:1.7em;line-height:1;font-style:normal}
.mit .mil{display:inline-flex;flex-direction:column;justify-content:space-between;align-self:stretch;font-size:.7em;margin-left:-.25em;min-height:2.2em}
.mit .mih,.mit .mib{display:block;line-height:1.1;min-height:.5em}
.mit .mih{margin-left:.5em}
/* редактор формул */
.np-dlg.fxdlg{width:min(780px,calc(100vw - 24px));max-width:none}
.fxtabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 6px}
.fxtabs button{border:0;background:var(--bg-alt);color:var(--text-2);font:inherit;font-size:13px;padding:6px 11px;border-radius:9px;cursor:pointer}
.fxtabs button.on{background:var(--accent);color:#fff}
.fxpal{max-height:178px;overflow:auto;border:1px solid var(--line-2);border-radius:12px;padding:8px;background:var(--bg-card)}
.fxg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.fxh{font-size:11.5px;color:var(--text-3);margin:6px 2px 3px;text-transform:uppercase;letter-spacing:.04em}
.fxb{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;padding:0 9px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-elev);color:var(--text);cursor:pointer;font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-size:19px;white-space:nowrap}
.fxb:hover{border-color:var(--accent);background:var(--accent-soft)}
.fxb.sy{min-width:38px;height:38px;padding:0 6px}
.fxb.sy.it{font-style:italic}
.fxb.fn{font-size:15px;font-style:normal}
.fxb .ph{display:inline-block;width:.55em;height:.7em;border:1.2px dashed var(--text-3);border-radius:2px;vertical-align:middle;margin:0 .05em}
.fxb .mfr>.mn,.fxb .mfr>.md{font-size:.8em}
.fxb .mbg .mbs{font-size:1.25em}
.fxb .mit .mis{font-size:1.4em}
.fxb svg{stroke:currentColor}
.fxcv{margin:12px 0 2px;min-height:96px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--bg-elev);padding:16px 14px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:auto;font-size:30px;line-height:1.25}
.fxcv>*{flex:none}
.fxcv input.fxi{font:inherit;font-style:italic;color:var(--text);background:transparent;border:0;outline:0;padding:0;margin:0;text-align:center;min-width:.3em;height:1.2em;border-radius:3px;box-shadow:none}
.fxcv input.fxi:focus{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent)}
.fxcv input.fxi.solo{background:color-mix(in srgb,var(--text) 6%,transparent);box-shadow:inset 0 0 0 1px var(--line-2)}
.fxcv input.fxi.solo:focus{box-shadow:0 0 0 1.5px var(--accent)}
.fxcv .mslot{display:inline-flex;align-items:center}
.fxcv .mfr>.mn,.fxcv .mfr>.md{display:flex;align-items:center;justify-content:center}
.fxcv .mbg .mbt,.fxcv .mbg .mbb,.fxcv .mit .mih,.fxcv .mit .mib{font-size:.7em}
.fxcv .msup input,.fxcv .msub input,.fxcv .mri input{font-size:inherit}
.np-dlg .acts .grow{flex:1}
/* ===== v6c: холст ===== */
.bd-task .bd-tb{flex:1}
.bd-task .sbl.bd{margin-top:8px;padding-left:4px}
.bd-task .sbl.bd li{font-size:12.5px;padding:2px 0 2px 16px}
.bd-task .sbl.bd li::after{top:11px;width:10px}
.bd-task .sck{width:16px;height:16px;border-radius:5px}.bd-task .sck svg{width:11px;height:11px}
.bd-task .atl.bd{margin-top:6px}.bd-task .atc{font-size:11.5px;padding:3px 8px}
.bd-attach{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg-elev);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.bd-attach .bd-ai{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;overflow:hidden}
.bd-attach .bd-an2{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.3}
.bd-attach .bd-an2 b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-attach .bd-an2 small{font-size:12px;color:var(--text-2)}
.bd-attach .bd-adl{flex:none;width:34px;height:34px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-card);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.bd-attach .bd-adl:hover{background:var(--accent-soft)}
.bd-attach .bd-adl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bd-link{display:flex;align-items:center;gap:10px;padding:0 16px 0 12px;background:var(--bg-elev);border:1px solid var(--line-2);border-radius:999px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.bd-link:hover{border-color:var(--accent);background:var(--accent-soft)}
.bd-link .bd-li{flex:none;width:24px;height:24px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:var(--accent)}
.bd-link .bd-li img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0;pointer-events:none}
.bd-link .bd-li svg,.lk-ic .bd-li svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bd-link .bd-ln{min-width:0;flex:1;font-size:14px;font-weight:600;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-ic{display:flex;align-items:center;gap:10px}
.lk-ic .bd-li{width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--accent);background:var(--bg-card)}
.lk-ic .bd-li img{width:100%;height:100%;object-fit:cover}
.err{color:#d70015;font-size:12.5px;margin-top:8px}
.tf-em [hidden]{display:none!important}
/* ===== v6: печать / PDF — как на экране ===== */
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#fff;--bg-alt:#f5f5f7;--bg-card:#f5f5f7;--bg-elev:#fff;--text:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;
    --line:rgba(0,0,0,.08);--line-2:rgba(0,0,0,.14);--accent:#0066cc;--accent-soft:rgba(0,102,204,.09);
    --code-bg:#f5f5f7;--code-fg:#1d1d1f;--mark:rgba(255,204,0,.55);--shadow:none;
  }
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:#fff!important;color:#1d1d1f!important}
  body.has-wp #wp,#wp,#heroShade,.tbl-guide,.img-ui,#pgLines,.pg-lines{display:none!important}
  .ed-title{margin:0 0 .5em!important;padding:0!important;height:auto!important;color:#000!important}
  .ed-card,.ed-area{overflow:visible!important}
  .nb,.ed{color:#1d1d1f!important;overflow:visible!important}
  /* таблицы: фиксированная сетка, рамки и ширины как на экране, разрыв между строками */
  .nb table{table-layout:fixed!important;border-collapse:separate!important;border-spacing:0!important;border:1px solid rgba(0,0,0,.14)!important;border-radius:12px!important;overflow:visible!important;break-inside:auto!important;page-break-inside:auto!important}
  .nb thead{display:table-header-group}
  .nb tr{break-inside:avoid!important;page-break-inside:avoid!important}
  .nb td,.nb th{border-right:1px solid rgba(0,0,0,.08)!important;border-bottom:1px solid rgba(0,0,0,.08)!important;padding:7px 10px!important;overflow-wrap:anywhere!important;word-break:break-word!important}
  .nb th{background:#f5f5f7!important;font-weight:600!important}
  .nb tr>*:last-child{border-right:0!important}.nb tr:last-child>*{border-bottom:0!important}
  /* код: фон, цвет и текст целиком, переносится по страницам */
  .nb pre{display:block!important;visibility:visible!important;background:#f5f5f7!important;color:#1d1d1f!important;border-radius:12px!important;padding:12px 14px!important;white-space:pre-wrap!important;word-break:break-word!important;overflow:visible!important;break-inside:auto!important;page-break-inside:auto!important;font-family:var(--mono)!important;font-size:13.5px!important;line-height:1.55!important}
  .nb pre code{display:block!important;color:#1d1d1f!important;background:none!important;font:inherit!important;white-space:pre-wrap!important}
  /* интервалы совпадают с экраном */
  .nb p,.nb ul,.nb ol,.nb blockquote,.nb pre,.nb table{margin:0 0 .7em!important}
  .nb h1{margin:.9em 0 .4em!important}.nb h2{margin:.9em 0 .4em!important}.nb h3{margin:.8em 0 .35em!important}

<script>
/* ===== Telegram Mini App: init, сохранение файлов, прокрутка шапки ===== */
const TG = (window.Telegram && Telegram.WebApp && Telegram.WebApp.platform && Telegram.WebApp.platform !== 'unknown') ? Telegram.WebApp : null;
if(TG){
  try{ TG.ready(); TG.expand(); }catch(e){}
  try{ if(TG.isVersionAtLeast && TG.isVersionAtLeast('7.7')) TG.disableVerticalSwipes(); }catch(e){}
}
/* необязательно: адрес вашего сервера, который принимает файл (POST) и возвращает {"url": "https://..."} —
   тогда в Telegram 8.0+ файл сохранится штатным окном загрузки Telegram. Оставьте '' если сервера нет. */
const YNG_UPLOAD_URL = '';

function yngAnchorSave(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 8000);
}
function yngFallbackDialog(blob, name){
  const isText = /^text\/|json|xml/.test(blob.type || '') || /\.(md|txt|json|html)$/i.test(name);
  const isImg = /^image\//.test(blob.type || '');
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px';
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--bg-elev,#fff);color:var(--text,#111);border-radius:16px;padding:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;font:14px/1.45 -apple-system,system-ui,sans-serif';
  const h = document.createElement('div'); h.style.cssText = 'font-weight:600;margin-bottom:8px;word-break:break-all'; h.textContent = name; box.appendChild(h);
  const note = document.createElement('div'); note.style.cssText = 'color:var(--text-2,#666);margin-bottom:10px';
  const close = document.createElement('button'); close.type = 'button'; close.textContent = 'Закрыть';
  close.style.cssText = 'margin-top:12px;padding:9px 16px;border:0;border-radius:980px;background:var(--accent,#06c);color:#fff;font:inherit';
  const done = () => { ov.remove(); if(blobUrl) URL.revokeObjectURL(blobUrl); };
  let blobUrl = null;
  close.onclick = done; ov.addEventListener('click', e => { if(e.target === ov) done(); });
  if(isText){
    note.textContent = 'Telegram не разрешает скачивание из мини-приложения. Скопируйте текст и вставьте в заметки или «Избранное».';
    const ta = document.createElement('textarea'); ta.readOnly = true; ta.style.cssText = 'width:100%;height:36vh;box-sizing:border-box;border:1px solid var(--line-2,#ccc);border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,monospace;background:transparent;color:inherit';
    blob.text().then(t => { ta.value = t; });
    const cp = document.createElement('button'); cp.type = 'button'; cp.textContent = 'Копировать';
    cp.style.cssText = close.style.cssText + ';margin-right:8px';
    cp.onclick = async () => { try{ await navigator.clipboard.writeText(ta.value); cp.textContent = 'Скопировано ✓'; }catch(e){ ta.select(); try{ document.execCommand('copy'); cp.textContent = 'Скопировано ✓'; }catch(_){ cp.textContent = 'Выделите и скопируйте вручную'; } } };
    box.append(note, ta, cp, close);
  } else if(isImg){
    note.textContent = 'Нажмите на картинку и удерживайте, затем выберите «Сохранить изображение».';
    blobUrl = URL.createObjectURL(blob);
    const im = document.createElement('img'); im.src = blobUrl; im.style.cssText = 'max-width:100%;border-radius:10px;display:block';
    box.append(note, im, close);
  } else {
    note.textContent = 'В мини-приложении Telegram этот тип файла сохранить нельзя. Откройте сайт в обычном браузере (меню ⋯ → «Открыть в браузере») и повторите.';
    box.append(note, close);
  }
  ov.appendChild(box); document.body.appendChild(ov);
}
/* единая точка сохранения: возвращает true/false */
async function yngSave(blob, name){
  if(!TG){ yngAnchorSave(blob, name); return true; }
  /* A. свой сервер + штатная загрузка Telegram */
  if(YNG_UPLOAD_URL && TG.downloadFile && TG.isVersionAtLeast && TG.isVersionAtLeast('8.0')){
    try{
      const r = await fetch(YNG_UPLOAD_URL, {method: 'POST', headers: {'X-Filename': encodeURIComponent(name)}, body: blob});
      const j = await r.json();
      if(j && j.url){ TG.downloadFile({url: j.url, file_name: name}); return true; }
    }catch(e){}
  }
  /* B. системное окно «Поделиться» (на iOS там есть «Сохранить в Файлы») */
  try{
    const f = new File([blob], name, {type: blob.type || 'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files: [f]})){ await navigator.share({files: [f], title: name}); return true; }
  }catch(e){ if(e && e.name === 'AbortError') return false; }
  /* C. десктопные клиенты Telegram обычно умеют обычную загрузку */
  if(/^(tdesktop|macos|weba|webk|web)$/.test(TG.platform)){ yngAnchorSave(blob, name); return true; }
  /* D. телефон без доступных способов — показываем копирование / картинку */
  yngFallbackDialog(blob, name);
  return true;
}

(function(){

    const n = document.querySelector('.nav-in'), a = n && n.querySelector('.nav-links a.act');
    if(n && a) n.scrollTo({left: a.offsetLeft - n.clientWidth / 2 + a.offsetWidth / 2, behavior: 'smooth'});
  }, 80);
  addEventListener('hashchange', fix); addEventListener('load', fix);
})();
</script>

<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/ё/g,'е');
const plural = (n, a, b, c) => { const m = n%10, h = n%100; return (m===1&&h!==11)? a : (m>=2&&m<=4&&(h<10||h>=20))? b : c; };
const store = {

  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = ts => new Date(ts).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
const todayISO = () => new Date().toISOString().slice(0, 10);
const todayRu = () => new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
const wordsWord = n => `${n} ${plural(n, 'слово', 'слова', 'слов')}`;

/* ---------- storage: IndexedDB → localStorage → memory ---------- */
const DR = {};               // id → draft record (only saved drafts)
const LS_KEY = 'yng-drafts-v1';
let db = null, ready = false;
function openDB(){
  return new Promise(res => {
    try{
      if(!window.indexedDB) return res(null);
      const r = indexedDB.open('yng-text', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('drafts', {keyPath:'id'}); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    }catch(e){ res(null); }
  });
}
const tx = (mode, fn) => new Promise((res, rej) => {
  const t = db.transaction('drafts', mode); const o = fn(t.objectStore('drafts'));
  t.oncomplete = () => res(o && o.result); t.onerror = t.onabort = () => rej(t.error);
});
function lsWrite(){ localStorage.setItem(LS_KEY, JSON.stringify(Object.values(DR))); }
async function dbPut(rec){ if(db) await tx('readwrite', s => s.put(rec)); else lsWrite(); }
async function dbDel(id){ if(db) await tx('readwrite', s => s.delete(id)); else lsWrite(); }
async function dbReplace(recs){
  if(db) await tx('readwrite', s => { s.clear(); recs.forEach(r => s.put(r)); });
  else lsWrite();
}
function fixRec(r){
  const o = {
    id: String(r.id), title: typeof r.title === 'string' ? r.title.slice(0, 160) : '', html: r.html,
    created: +r.created || +r.updated || Date.now(), updated: +r.updated || Date.now(),
    pinned: !!r.pinned, hist: Array.isArray(r.hist) ? r.hist.filter(h => h && typeof h.html === 'string').slice(-10) : [],
    folder: typeof r.folder === 'string' && /^[\w-]{3,40}$/.test(r.folder) ? r.folder : null,
    date: /^\d{4}-\d\d-\d\d$/.test(r.date || '') ? r.date : null, tags: normTags(r.tags || []),
    page: ['a5', 'a4', 'a3'].includes(r.page) ? r.page : null
  };
  if(r.kind === 'deck' && r.deck){ const dd = dkFixDeck(r.deck); if(dd){ o.kind = 'deck'; o.deck = dd; } }
  return o;
}
async function initStore(){
  db = await openDB();
  let recs = [];
  try{
    if(db) recs = await tx('readonly', s => s.getAll());
    else recs = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
  }catch(e){ recs = []; }
  (recs || []).forEach(r => { if(r && typeof r.id === 'string' && typeof r.html === 'string') DR[r.id] = fixRec(r); });
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  ready = true;
}

/* ---------- sanitizer (whitelist) ---------- */
const OK = new Set('p h1 h2 h3 br strong b em i u s strike del mark a ul ol li blockquote pre code table colgroup col thead tbody tr td th img hr span'.split(' '));
const DROP = new Set('script style iframe object embed link meta title head noscript svg form input button textarea select video audio canvas template'.split(' '));
const TOPB = new Set('P H1 H2 H3 UL OL BLOCKQUOTE PRE TABLE HR'.split(' '));
const BLK = /^(p|div|section|article|header|footer|main|aside|nav|figure|figcaption|details|summary|dl|dt|dd|h[1-6]|tfoot|caption|center|address|li|ul|ol|blockquote|pre|table|hr)$/;

      if(tag === 'img'){
        const src2 = n.getAttribute('src') || '';

      if(tag === 'p'){

        const chs = n.getAttribute('data-ch');
        if(chs && chValid(chs)){ el.setAttribute('data-ch', chs); chFill(el); dst.appendChild(el); continue; }
        if(fxs && fxValid(fxs)){ el.setAttribute('data-fx', fxs); fxFill(el); dst.appendChild(el); continue; }
        if(fw && okId(fw)){ el.setAttribute('data-fw', fw); el.setAttribute('data-n', String(n.getAttribute('data-n') || 'файл').slice(0, 200)); el.setAttribute('data-s', String(parseInt(n.getAttribute('data-s'), 10) || 0)); fwFill(el); dst.appendChild(el); continue; }
        if(k && /^[\w-]{3,40}$/.test(k)){ el.setAttribute('data-tk', k); el.setAttribute('contenteditable', 'false'); el.textContent = ((n.querySelector('.tkt') || n).textContent || '').slice(0, 300); dst.appendChild(el); continue; }
        if(n.classList && n.classList.contains('cap')){ const ck = n.getAttribute('data-cap') === 't' ? 't' : 'i'; el.className = 'cap'; el.setAttribute('data-cap', ck); }
      }

      if(tag === 'a'){
        const h = (n.getAttribute('href') || '').trim();
        if(/^(https?:|mailto:|tel:|#)/i.test(h)){ el.setAttribute('href', h); el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
        else { walk(n, dst); continue; }

function normalize(root){
  let p = null;
  for(const n of Array.from(root.childNodes)){
    if(n.nodeType === 1 && TOPB.has(n.tagName)){ p = null; continue; }
    if(n.nodeType === 3 && !n.nodeValue.trim() && !p){ n.remove(); continue; }
    if(!p){ p = document.createElement('p'); root.insertBefore(p, n); }
    p.appendChild(n);
  }
  root.querySelectorAll('ul>ul,ul>ol,ol>ul,ol>ol').forEach(l => {
    let prev = l.previousElementSibling;
    if(!prev || prev.tagName !== 'LI'){ prev = document.createElement('li'); l.parentNode.insertBefore(prev, l); }
    prev.appendChild(l);
  });
  root.querySelectorAll('td,th,li,p,h1,h2,h3').forEach(c => { if(!c.firstChild) c.appendChild(document.createElement('br')); });
  root.querySelectorAll('table').forEach(t => { if(!t.rows.length) t.remove(); });
  root.querySelectorAll('blockquote').forEach(q => { if(!q.textContent.trim() && !q.querySelector('img,table')) q.remove(); });
  ensureTail(root);
}
function ensureTail(root){
  const l = root.lastElementChild;
  if(!l || !/^(P|H1|H2|H3)$/.test(l.tagName) || l.querySelector('img') || l.hasAttribute('data-tk')){
    const p = document.createElement('p'); p.appendChild(document.createElement('br')); root.appendChild(p);
  }
}

function htmlToMd(html){

    if(n.nodeType !== 1) return '';

    const wrap = (m) => { const s = kids(); const t = s.trim(); return t ? s.replace(t, m + t + m) : ''; };

      case 'strong': case 'b': return wrap('**');

      case 'a': return '[' + kids() + '](' + n.getAttribute('href') + ')';

function htmlToText(html){
  const root = document.createElement('div'); root.innerHTML = sanitize(html); tkPre(root);
  root.querySelectorAll('img').forEach(i => i.replaceWith(document.createTextNode(' [изображение] ')));

function mdInline(s){
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });

       .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
       .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>')
       .replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
       .replace(/~~(.+?)~~/g, '<s>$1</s>').replace(/==(.+?)==/g, '<mark>$1</mark>')
       .replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g, '<u>$1</u>');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
}
function mdToHtml(src){
  const L = String(src).replace(/\r\n?/g, '\n').split('\n'); const out = []; let i = 0;
  const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const sepRe = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  const isTbl = (a, b) => b !== undefined && a.indexOf('|') >= 0 && sepRe.test(b);
  const cells = r => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
  const task = t => t.replace(/^\[( |x|X)\]\s+/, (m, c) => c === ' ' ? '☐ ' : '☑ ');
  while(i < L.length){
    const ln = L[i]; let m;
    if(!ln.trim()){ i++; continue; }
    if((m = ln.match(/^\s*(```|~~~)/))){
      const fence = m[1]; i++; const buf = [];
      while(i < L.length && !L[i].trim().startsWith(fence)){ buf.push(L[i]); i++; }
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if((m = ln.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){ const lv = Math.min(3, m[1].length); out.push(`<h${lv}>${mdInline(m[2])}</h${lv}>`); i++; continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
    if(/^\s*>/.test(ln)){
      const buf = []; while(i < L.length && /^\s*>/.test(L[i])){ buf.push(L[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + mdToHtml(buf.join('\n')) + '</blockquote>'); continue;
    }
    if(isTbl(ln, L[i + 1])){
      const head = cells(ln); i += 2; const rows = [];
      while(i < L.length && L[i].trim() && L[i].indexOf('|') >= 0){ rows.push(cells(L[i])); i++; }
      out.push('<table><tbody><tr>' + head.map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr>' +
        rows.map(r => '<tr>' + head.map((_, k) => '<td>' + mdInline(r[k] || '') + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if(listRe.test(ln)){
      const items = [];
      while(i < L.length && listRe.test(L[i])){ const mm = L[i].match(listRe); items.push({ind: mm[1].replace(/\t/g, '    ').length, ord: /\d/.test(mm[2]), text: task(mm[3])}); i++; }
      let html = '', stack = [];
      for(const it of items){
        const tag = it.ord ? 'ol' : 'ul';
        while(stack.length && it.ind < stack[stack.length - 1].ind){ html += '</li></' + stack.pop().tag + '>'; }
        if(stack.length && it.ind === stack[stack.length - 1].ind) html += '</li>';
        else { html += '<' + tag + '>'; stack.push({ind: it.ind, tag}); }
        html += '<li>' + mdInline(it.text);
      }
      while(stack.length) html += '</li></' + stack.pop().tag + '>';
      out.push(html); continue;
    }
    const buf = [];
    while(i < L.length && L[i].trim() && !/^\s*(```|~~~|#{1,6}\s|>)/.test(L[i]) && !listRe.test(L[i]) && !isTbl(L[i], L[i + 1])){ buf.push(L[i]); i++; }
    if(!buf.length){ buf.push(L[i]); i++; }
    out.push('<p>' + buf.map((l, k) => mdInline(l.replace(/\s+$/, '')) + (k < buf.length - 1 ? (/(\s{2,}|\\)$/.test(buf[k]) ? '<br>' : ' ') : '')).join('') + '</p>');
  }
  return out.join('\n');
}
function textToHtml(t){

  if(pop && popFor === anchor){ closePop(); return null; }

  pop.addEventListener('mousedown', e => { if(!e.target.closest('input')) e.preventDefault(); });

  t.innerHTML = '<span></span>'; t.firstChild.textContent = msg;

  requestAnimationFrame(() => t.classList.add('on'));

function dialog(html, cls, mount){
  bubble.classList.remove('on');
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'np-modal';
    m.innerHTML = `<div class="np-dlg ${cls || ''}" role="dialog" aria-modal="true">${html}</div>`;
    const done = v => { m.remove(); document.removeEventListener('keydown', kd, true); res(v); };
    const kd = e => { if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done(null); } };
    m.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if(b) done(b.dataset.v); else if(e.target === m) done(null); });
    document.addEventListener('keydown', kd, true);
    document.body.appendChild(m);
    mount && mount(m, done);
    (m.querySelector('[data-focus]') || m.querySelector('button')).focus();
  });
}
function modal({title, text, buttons}){

}
